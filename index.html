e": "safe-top", "value": "env(safe-area-inset-top, 0px)", "usage": "Вирізи й «острів» телефона. Липкі шапки: padding-top: var(--safe-top)."}, {"name": "safe-bottom", "value": "env(safe-area-inset-bottom, 0px)", "usage": "Індикатор «додому». Нижня навігація, шторки й липкі кнопки відступають на цю величину."}]}, "icon": {"tokens": [{"name": "icon-sm", "value": "16px", "usage": "Small-кнопки, теги."}, {"name": "icon-md", "value": "20px", "usage": "Кнопки, поля."}, {"name": "icon-lg", "value": "24px", "usage": "Навігація."}, {"name": "icon-xl", "value": "32px", "usage": "Ілюстративні."}, {"name": "icon-stroke", "value": "1.5", "usage": "Товщина лінії іконок."}]}, "duration": {"note": "При prefers-reduced-motion усі тривалості стають 0.", "tokens": [{"name": "duration-fast", "value": "120ms", "usage": "Hover, натиск."}, {"name": "duration-base", "value": "200ms", "usage": "Перемикачі, fade, таби."}, {"name": "duration-slow", "value": "320ms", "usage": "Модалки, панелі, меню."}, {"name": "duration-slower", "value": "480ms", "usage": "Великі переходи."}]}, "easing": {"tokens": [{"name": "ease-standard", "value": "cubic-bezier(.2, 0, 0, 1)", "usage": "Більшість переходів."}, {"name": "ease-emphasized", "value": "cubic-bezier(.3, 0, 0, 1.15)", "usage": "Поява шарів, «крапля» з легким перельотом."}, {"name": "ease-exit", "value": "cubic-bezier(.4, 0, 1, 1)", "usage": "Зникнення."}]}, "zIndex": {"tokens": [{"name": "z-base", "value": "0", "usage": "Контент."}, {"name": "z-dropdown", "value": "1000", "usage": "Меню, списки, календар."}, {"name": "z-sticky", "value": "1100", "usage": "Липкий хедер, панель масових дій."}, {"name": "z-overlay", "value": "1300", "usage": "Затемнення."}, {"name": "z-modal", "value": "1400", "usage": "Модалки, бокові панелі."}, {"name": "z-toast", "value": "1500", "usage": "Сповіщення."}, {"name": "z-tooltip", "value": "1600", "usage": "Підказки."}]}}, "readme": "<p>Ліс — земляна дизайн-система для сайтів і застосунків: теплий беж, лісовий зелений, кавовий коричневий і теракота, широкий український гротеск Ermilov у заголовках і KyivType Sans у тексті. Основна тема — темна, світла — повноцінна пара для перемикання. Плаваючі шари зі скла, у дусі iOS 26.<\/p>\n<h2>Як підключити<\/h2>\n<ol>\n<li><code>tokens.css<\/code> (згенерований з <code>tokens.json<\/code>), потім <code>components/bundle.css<\/code>, потім <code>components/bundle.js<\/code>.<\/li>\n<li>На <code>&lt;html&gt;<\/code> — <code>data-theme=\"dark\"<\/code> (за замовчуванням) або <code>data-theme=\"light\"<\/code>.<\/li>\n<li>Після розмітки — <code>DS.init()<\/code>: оживляє списки, календарі, сегменти, таби, акордеони, модалки, таблиці, підказки. Сповіщення — <code>DS.toast({...})<\/code>.<\/li>\n<li>Компоненти — це HTML + класи (<code>.btn.btn--primary<\/code>, <code>.field<\/code>, <code>.dd<\/code>…), без фреймворку. Розмітку бери з карток компонентів.<\/li>\n<li>Стилі пиши лише через семантичні токени <code>--color-*<\/code>, <code>--space-*<\/code>, <code>--radius-*<\/code>. Шкали (<code>--sand-500<\/code>, <code>--forest-300<\/code>) напряму не використовуй.<\/li>\n<li>Для телефона в <code>&lt;head&gt;<\/code> — <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"&gt;<\/code>: без <code>viewport-fit=cover<\/code> відступи safe-area (<code>--safe-top<\/code>, <code>--safe-bottom<\/code>) дорівнюють нулю.<\/li>\n<\/ol>\n<h2>Голос і текст<\/h2>\n<ul>\n<li>Українською, на «ви», спокійно й конкретно. Без емодзі, без знаків оклику в інтерфейсі.<\/li>\n<li>Кнопка — дієслово, що описує результат: «Оформити замовлення», «Зберегти», «Видалити». Не «ОК», не «Надіслати форму».<\/li>\n<li>Помилка пояснює, як виправити: «Введіть 9 цифр номера», «Введіть email повністю, напр. olena@mail.com». Без «Щось пішло не так».<\/li>\n<li>Сповіщення: заголовок — що сталося («Додано в кошик»), текст — деталь («Крісло «Дуб», 1 шт.»).<\/li>\n<li>Ціни: <code>12 400 ₴<\/code> (нерозривний пробіл тисяч, знак після числа). Дати: «3 листопада 2026», у таблицях «3 лист 2026». Лапки «ялинки».<\/li>\n<li>Регістр: великими літерами лише <code>display-xl<\/code>, <code>display-l<\/code>, <code>h1<\/code>, <code>h2<\/code> і <code>eyebrow<\/code>. Решта — звичайний регістр, з великої лише перше слово.<\/li>\n<\/ul>\n<h2>Колір<\/h2>\n<ul>\n<li>Темна тема (основна): фон <code>color-bg<\/code> — зелено-чорний <code>sand-950<\/code>, поверхні <code>color-surface<\/code> / <code>color-surface-raised<\/code>, текст <code>color-text<\/code> — беж <code>sand-100<\/code>.<\/li>\n<li>Світла тема: фон — теплий беж <code>sand-50<\/code>, текст — той самий зелено-чорний. Темна й світла — одна шкала Sand: світлі кроки беж, темні переходять у лісовий чорний.<\/li>\n<li><code>color-primary<\/code> (зелений Forest) — головна дія, активне, обране. Одна primary-кнопка на екран.<\/li>\n<li><code>color-secondary<\/code> (коричневий Cocoa) — вторинна дія того ж рівня, цитати, великі цифри.<\/li>\n<li><code>color-accent<\/code> (теракота Clay) — лише великі заголовки, декор і заливки; для дрібного тексту й посилань — <code>color-accent-text<\/code>; для кнопки — <code>color-accent-strong<\/code> + <code>color-on-accent<\/code>. Акцент — рідко: промо, новинки.<\/li>\n<li>Статуси: <code>color-success<\/code>, <code>color-warning<\/code>, <code>color-error<\/code>, <code>color-info<\/code> — завжди разом зі словом чи іконкою, ніколи лише кольором.<\/li>\n<li>Контраст перевірено в обох темах: текст ≥4.5:1 на <code>color-bg<\/code> і <code>color-surface<\/code> (основний ≥10:1), рамки полів <code>color-border-strong<\/code> і кільце фокусу <code>color-focus<\/code> ≥3:1.<\/li>\n<li>Текст на заливці — тільки парні токени <code>on-*<\/code>: <code>color-on-primary<\/code>, <code>color-on-secondary<\/code>, <code>color-on-accent<\/code>, <code>on-danger<\/code>.<\/li>\n<\/ul>\n<h2>Типографіка<\/h2>\n<ul>\n<li>Заголовки — Ermilov (одне накреслення, Bold): широкий геометричний гротеск. Ієрархію будуємо розміром, регістром і кольором, а не товщиною.<\/li>\n<li>Текст і весь інтерфейс — KyivType Sans 400 / 500 / 600: абзаци, кнопки (<code>label<\/code>), поля, підписи (<code>caption<\/code>), таблиці.<\/li>\n<li>Ermilov не менше 18px і не для абзаців, кнопок, полів. Знак ₴ в Ermilov відсутній — підставляється з KyivType Sans.<\/li>\n<li>Заголовки сторінок адаптивні (clamp): <code>display-xl<\/code> 48→104px, <code>h1<\/code> 34→56px, <code>h2<\/code> 28→40px. Текст має фіксований розмір; поля вводу 16px.<\/li>\n<li>Ширина абзацу — <code>measure<\/code> (65ch). Цифри в таблицях, цінах і показниках — <code>tabular-nums<\/code>.<\/li>\n<li>Ціна — <code>.price<\/code> (Ermilov 22px), показник — <code>.stat__value<\/code>. Два широкі заголовкові шрифти поруч не ставимо.<\/li>\n<\/ul>\n<h2>Простір, форма, глибина<\/h2>\n<ul>\n<li>Сітка 4px: <code>space-1<\/code>…<code>space-32<\/code>. Усередині групи відступ менший, ніж між групами; під великим заголовком — щонайменше <code>space-6<\/code>. Секції — <code>space-section<\/code> (64→128px), поля сторінки — <code>space-page-x<\/code>.<\/li>\n<li>Контейнер до <code>container-xl<\/code> (1280px), 12 колонок, проміжок <code>grid-gutter<\/code>.<\/li>\n<li>Радіуси: кнопки й поля <code>radius-md<\/code> (10px), картки й меню <code>radius-lg<\/code> (16px), модалки й банери <code>radius-xl<\/code> (24px), капсули <code>radius-full<\/code>.<\/li>\n<li>Концентричні кути: внутрішній радіус = зовнішній − відступ. Усередині капсули (навбар, тулбар, пагінація) кнопки й hover теж капсули — клас <code>.pill-group<\/code> на контейнері.<\/li>\n<li>Рамки: <code>border-thin<\/code> 1px — роздільники; <code>border-input<\/code> 1.5px — поля, контурні кнопки; <code>border-strong<\/code> 2px — вибране.<\/li>\n<li>Скролбар єдиний на сторінці, у списках, модалках і таблицях: капсула 6px у відступі 3px, прозорий трек, без стрілок. Бігунок — <code>color-scrollbar<\/code> (≥3:1 до фону в обох темах), при наведенні — <code>color-scrollbar-hover<\/code>. Chromium і Safari — <code>::-webkit-scrollbar<\/code>, Firefox — <code>scrollbar-color<\/code>. Схований скрол (таби, фільтри) — <code>scrollbar-width: none<\/code>.<\/li>\n<li>Глибина <code>elevation-0…4<\/code>. У темній темі вищий рівень — світліша поверхня (<code>surface-1…4<\/code>) + тонкий світлий край <code>highlight-top<\/code>; у світлій — теплі тіні з відтінком лісового чорного.<\/li>\n<\/ul>\n<h2>Скло<\/h2>\n<ul>\n<li>Матеріал <code>.glass<\/code> / <code>.glass-strong<\/code> — тільки для шару, що плаває над контентом: навбар, сегментовані перемикачі, тулбари над фото, меню, списки, календар, тултіпи, сповіщення, панель масових дій, hover прозорих кнопок і тегів.<\/li>\n<li>Не для основних поверхонь, карток у сітці, форм, модальних вікон і основних кнопок. Скло на склі — ні.<\/li>\n<li>Текст на склі — на <code>glass-strong<\/code>. При «зменшити прозорість» скло автоматично стає щільною поверхнею.<\/li>\n<li>Найкраще працює над фото й насиченим фоном; на рівному фоні — легкий блік.<\/li>\n<\/ul>\n<h2>Рух<\/h2>\n<ul>\n<li><code>duration-fast<\/code> 120ms — hover і натиск; <code>duration-base<\/code> 200ms — перемикачі, fade; <code>duration-slow<\/code> 320ms — меню, модалки; <code>ease-emphasized<\/code> — поява шарів і «крапля» з легким перельотом.<\/li>\n<li>Анімації короткі, без декоративного руху. При <code>prefers-reduced-motion<\/code> усі тривалості — 0.<\/li>\n<\/ul>\n<h2>Стани та доступність<\/h2>\n<ul>\n<li>Фокус клавіатури — кільце <code>focus-ring-width<\/code> 3px кольору <code>color-focus<\/code> з відступом 2px, однакове для всіх елементів.<\/li>\n<li>Мінімальна зона натиску 44×44px (<code>--touch-target<\/code>). Кнопка-іконка завжди з <code>aria-label<\/code>. Правила для телефона — нижня навігація, шторки, safe area, форми — у розділі «Мобільна версія».<\/li>\n<li>Вимкнене — <code>disabled-bg<\/code> / <code>disabled-fg<\/code> (кнопки, поля) або прозорість .45 (контроли вибору).<\/li>\n<li>Списки, календар, таби, модалки керуються з клавіатури й мають ARIA-ролі. Модалка утримує фокус і повертає його на кнопку.<\/li>\n<li>Завантаження — скелетон тієї ж форми (<code>.skel<\/code>), у кнопці — <code>.is-loading<\/code>.<\/li>\n<\/ul>\n<h2>Іконки<\/h2>\n<ul>\n<li>Власні лінійні іконки: сітка 24×24, лінія <code>icon-stroke<\/code> 1.5, закруглені кінці, колір <code>currentColor<\/code>, інлайн SVG.<\/li>\n<li>Розміри: <code>icon-sm<\/code> 16px (small-кнопки, теги), <code>icon-md<\/code> 20px (кнопки, поля), <code>icon-lg<\/code> 24px.<\/li>\n<li>Емодзі як іконки не використовуємо. Логотипа поки немає — слово «Ліс» набране Ermilov.<\/li>\n<\/ul>\n<h2>Фреймворки (React, Vue та інші)<\/h2>\n<ul>\n<li>Джерело правди — <code>tokens.css<\/code> і <code>components/bundle.css<\/code>. Не копіюй значення в JS, CSS-in-JS чи конфіг Tailwind: підключай ці файли.<\/li>\n<li>Компонент у фреймворку — обгортка над тією самою розміткою й класами: <code>&lt;button className=\"btn btn--primary\"&gt;<\/code>. Нових варіантів і стилів поза каталогом не вигадуй.<\/li>\n<li>Поведінку (<code>.dd<\/code>, <code>.dp<\/code>, <code>.segmented<\/code>, <code>[data-tabs]<\/code>, <code>[data-acc]<\/code>, <code>.modal<\/code>, <code>[data-table]<\/code>, <code>[data-tip]<\/code>) дає <code>DS.init(scope)<\/code>: виклич у <code>useEffect<\/code> після монтування контейнера і ще раз після зміни його вмісту. Повторний виклик безпечний.<\/li>\n<li>Вузли, якими керує DS (відкритий список, календар), не перерендерюй і не міняй їм стан-класи вручну. Значення бери з подій <code>dd:change<\/code>, <code>dp:change<\/code>, <code>seg:change<\/code>.<\/li>\n<li>Модалка — <code>DS.modal(id).open()<\/code> / <code>.close()<\/code>, сповіщення — <code>DS.toast({...})<\/code>; власних порталів і стеків сповіщень не роби.<\/li>\n<li>Тема — лише атрибут <code>data-theme<\/code> на <code>&lt;html&gt;<\/code>.<\/li>\n<li>Потрібного немає в каталозі — збери з токенів і наявних класів та додай у систему, а не лишай локальним винятком.<\/li>\n<\/ul>\n<h2>Перед здачею<\/h2>\n<ul>\n<li>Жодного сирого hex, шрифта чи <code>z-index<\/code> вище 2: лише токени <code>--color-*<\/code>, <code>--font-*<\/code>, <code>--z-*<\/code>.<\/li>\n<li>Одна primary-кнопка на екран; статус — завжди зі словом чи іконкою, не лише кольором.<\/li>\n<li>Обидві теми (<code>dark<\/code>, <code>light<\/code>) і ширина 390px без горизонтального скролу.<\/li>\n<li>Зона натиску ≥44×44px, кнопка-іконка з <code>aria-label<\/code>, фокус видно.<\/li>\n<\/ul>\n<h2>Шрифти й ліцензії<\/h2>\n<ul>\n<li>Ermilov — Кирило Ткачов, шрифт бренду Ukraine Now; вільний для комерційного й приватного використання (Banda Agency / The Village, 19.07.2018).<\/li>\n<li>KyivType Sans — Dmitry Rastvortsev, CC BY-ND 4.0: файли не змінювати й не конвертувати; у футері вказувати автора.<\/li>\n<\/ul>\n<h2>Автор<\/h2>\n<ul>\n<li>Євген Легенький — дизайн і розробка системи. Instagram <a href=\"https://www.instagram.com/legen_eugnekyi/\">@legen_eugnekyi<\/a>, LinkedIn <a href=\"https://www.linkedin.com/in/yevhen-lehenkyi/\">yevhen-lehenkyi<\/a>.<\/li>\n<\/ul>", "components": [{"name": "Accordion", "group": "Content", "height": 260, "readme": "<p>Список питань з відповідями, що розгортаються (FAQ, характеристики). <code>.acc[data-acc]<\/code> &gt; <code>.acc__item<\/code> &gt; <code>button.acc__btn<\/code> + <code>.acc__panel &gt; div &gt; p<\/code>.<\/p>\n<ul>\n<li><code>data-acc=\"single\"<\/code> — одночасно відкрита одна відповідь; без значення — будь-скільки. Відкритий за замовчуванням — <code>.is-open<\/code>.<\/li>\n<li>«Плюс» у колі плавно стає «мінусом» на заливці <code>color-primary<\/code>; висота анімується (grid-rows), <code>duration-slow<\/code>.<\/li>\n<\/ul>", "code": "<div class=\"acc\" data-acc=\"single\"><div class=\"acc__item is-open\"><button class=\"acc__btn\">Скільки триває доставка?<span class=\"acc__icon\" aria-hidden=\"true\"><\/span><\/button><div class=\"acc__panel\"><div><p>1–2 дні Новою поштою. Великі меблі — власна служба, 3–5 днів.<\/p><\/div><\/div><\/div>\n<div class=\"acc__item\"><button class=\"acc__btn\">Чи можна повернути товар?<span class=\"acc__icon\" aria-hidden=\"true\"><\/span><\/button><div class=\"acc__panel\"><div><p>Так, 30 днів. Зворотну доставку оплачуємо ми.<\/p><\/div><\/div><\/div>\n<div class=\"acc__item\"><button class=\"acc__btn\">Як доглядати за деревом?<span class=\"acc__icon\" aria-hidden=\"true\"><\/span><\/button><div class=\"acc__panel\"><div><p>Раз на пів року — олія з комплекту.<\/p><\/div><\/div><\/div><\/div>", "page": false, "summary": "Список питань з відповідями, що розгортаються (FAQ, характеристики). .acc[data-acc] > .acc__item > button.acc__btn + .acc__panel > div > p."}, {"name": "Badge", "group": "Status", "height": 130, "readme": "<p>Статус одним-двома словами. На бейдж не клікають — для клікабельних є <code>Tag<\/code>.<\/p>\n<ul>\n<li><code>.badge<\/code> + тон <code>--brand | --success | --warning | --error | --info | --accent<\/code>; м'який фон — 18%/14% тону (<code>--soft-mix<\/code>).<\/li>\n<li><code>.badge--dot<\/code> — для таблиць і списків; <code>.badge--solid<\/code> — один акцент на картці товару; <code>.badge--count<\/code> — лічильник.<\/li>\n<li>Статус завжди словом, не лише кольором.<\/li>\n<\/ul>", "code": "<div class=\"stack\"><div class=\"row\"><span class=\"badge\">Нейтральний<\/span><span class=\"badge badge--brand\">Бренд<\/span><span class=\"badge badge--success\">Доставлено<\/span><span class=\"badge badge--warning\">Очікує<\/span><span class=\"badge badge--error\">Скасовано<\/span><span class=\"badge badge--info\">Нове<\/span><span class=\"badge badge--accent\">−20%<\/span><\/div>\n<div class=\"row\"><span class=\"badge badge--dot badge--success\">Онлайн<\/span><span class=\"badge badge--dot badge--warning\">В обробці<\/span><span class=\"badge badge--solid badge--brand\">Хіт<\/span><span class=\"badge badge--solid badge--accent\">Новинка<\/span><button class=\"btn btn--ghost\">Кошик <span class=\"badge badge--count\">3<\/span><\/button><\/div><\/div>", "page": false, "summary": "Статус одним-двома словами. На бейдж не клікають — для клікабельних є Tag."}, {"name": "Breadcrumbs", "group": "Navigation", "height": 70, "readme": "<p>Шлях до поточної сторінки: <code>ol.crumbs[aria-label]<\/code> &gt; <code>li &gt; a<\/code>, останній — <code>span[aria-current=\"page\"]<\/code>. Роздільник-шеврон малює CSS. Над заголовком сторінки товару чи статті.<\/p>", "code": "<ol class=\"crumbs\" aria-label=\"Хлібні крихти\"><li><a href=\"#\">Головна<\/a><\/li><li><a href=\"#\">Каталог<\/a><\/li><li><a href=\"#\">Крісла<\/a><\/li><li><span aria-current=\"page\">Крісло «Дуб»<\/span><\/li><\/ol>", "page": false, "summary": "Шлях до поточної сторінки: ol.crumbs[aria-label] > li > a, останній — span[aria-current=\"page\"]. Роздільник-шеврон малює CSS. Над заголовком сторінки товару чи статті. "}, {"name": "Button", "group": "Actions", "height": 300, "readme": "<p>Кнопка дії: шість варіантів, три розміри, усі стани. Клас <code>.btn<\/code> + варіант <code>.btn--primary | --secondary | --accent | --outline | --ghost | --danger<\/code>.<\/p>\n<h2>Використання<\/h2>\n<ul>\n<li>Одна <code>btn--primary<\/code> на екран або секцію. Вторинна дія того ж рівня — <code>btn--secondary<\/code> (коричнева) або <code>btn--outline<\/code>.<\/li>\n<li><code>btn--accent<\/code> (теракота) — лише промо й маркетингові CTA.<\/li>\n<li><code>btn--danger<\/code> — тільки для незворотних дій і завжди з підтвердженням у <code>Modal<\/code>.<\/li>\n<li>Розміри: <code>btn--sm<\/code> (36px, тільки щільні таблиці й тулбари), базовий 44px, <code>btn--lg<\/code> (52px, hero й оформлення). Зона натиску ≥44×44.<\/li>\n<li>Іконка: інлайн SVG першою дитиною (<code>gap: space-2<\/code>). Кнопка-іконка — <code>btn--icon<\/code> + обов'язковий <code>aria-label<\/code>; кругла — <code>btn--round<\/code>.<\/li>\n<li>Стани: <code>:disabled<\/code>, <code>.is-loading<\/code> (спінер, текст ховається). <code>.is-hover/.is-active/.is-focus<\/code> — лише для документації.<\/li>\n<li>Hover прозорих і контурних кнопок — скляна «крапля» (<code>glass-hover<\/code>, <code>glass-spec<\/code>).<\/li>\n<li>Усередині капсули (навбар, тулбар) додайте контейнеру <code>.pill-group<\/code>: кнопки стануть капсулами.<\/li>\n<li>Текст — дієслово: «Зберегти», «Оформити замовлення», а не «ОК».<\/li>\n<\/ul>\n<h2>Що дає споживач<\/h2>\n<p>Текст або іконку, <code>type<\/code>, обробник. Шрифт — <code>label<\/code> (KyivType Sans 600), ніколи Ermilov.<\/p>", "code": "<div class=\"stack\">\n<div class=\"row\"><button class=\"btn btn--primary\">Основна дія<\/button><button class=\"btn btn--secondary\">Вторинна<\/button><button class=\"btn btn--accent\">Акцентна<\/button><button class=\"btn btn--outline\">Контурна<\/button><button class=\"btn btn--ghost\">Прозора<\/button><button class=\"btn btn--danger\"><svg>…<\/svg>Видалити<\/button><\/div>\n<div class=\"row\"><button class=\"btn btn--primary is-hover\">Hover<\/button><button class=\"btn btn--primary is-focus\">Focus<\/button><button class=\"btn btn--primary\" disabled>Disabled<\/button><button class=\"btn btn--primary is-loading\">Loading<\/button><button class=\"btn btn--outline is-hover\">Glass hover<\/button><\/div>\n<div class=\"row\"><button class=\"btn btn--primary btn--sm\">Small 36<\/button><button class=\"btn btn--primary\">Medium 44<\/button><button class=\"btn btn--primary btn--lg\">Large 52 <svg>…<\/svg><\/button><button class=\"btn btn--outline btn--icon\" aria-label=\"Пошук\"><svg>…<\/svg><\/button><button class=\"btn btn--ghost btn--icon btn--round\" aria-label=\"Обране\"><svg>…<\/svg><\/button><\/div>\n<\/div>", "page": false, "summary": "Кнопка дії: шість варіантів, три розміри, усі стани. Клас .btn + варіант .btn--primary | --secondary | --accent | --outline | --ghost | --danger."}, {"name": "Card", "group": "Content", "height": 460, "readme": "<p>Контейнер товару, статті чи показника: <code>.card<\/code> (<code>surface<\/code>, <code>border<\/code>, <code>radius-lg<\/code>).<\/p>\n<ul>\n<li>Клікабельна картка — одне посилання <code>a.card.card--interactive<\/code>: піднімається на 3px з <code>elevation-2<\/code>, зображення збільшується. Кнопки всередині — <code>preventDefault<\/code>.<\/li>\n<li>Структура: <code>.card__media<\/code> (4:3; <code>.card__badges<\/code>, <code>.card__fav<\/code> — скляна кнопка поверх фото) + <code>.card__body<\/code> (<code>.card__eyebrow<\/code>, <code>.card__title<\/code>, <code>.card__text<\/code>, <code>.card__meta<\/code>, <code>.card__foot<\/code>).<\/li>\n<li>Ціна — <code>.price<\/code> (Ermilov 22px); зі знижкою — <code>.price--sale<\/code> + <code>&lt;s&gt;<\/code> стара ціна. Немає в наявності — ціна <code>color-text-muted<\/code>, кнопка «Повідомити».<\/li>\n<li>Показник — <code>.card.stat<\/code> (<code>.stat__label<\/code>, <code>.stat__value<\/code>, бейдж динаміки). Горизонтальна — <code>.card--h<\/code>.<\/li>\n<li>Завантаження — скелетон тієї ж форми (<code>.skel<\/code>), не спінер.<\/li>\n<\/ul>", "code": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n<a class=\"card card--interactive\" href=\"#\" onclick=\"event.preventDefault()\"><div class=\"card__media\"><div class=\"art a1\"><\/div><div class=\"card__badges\"><span class=\"badge badge--solid badge--accent\">Новинка<\/span><\/div><button class=\"btn btn--ghost btn--icon btn--sm card__fav glass\" aria-label=\"В обране\"><svg>…<\/svg><\/button><\/div><div class=\"card__body\"><span class=\"rating\"><svg>…<\/svg>4,9 · 128<\/span><h3 class=\"card__title\">Крісло «Дуб» з льняною подушкою<\/h3><div class=\"card__foot\"><span class=\"price\">12 400 ₴<\/span><button class=\"btn btn--primary btn--sm btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/a>\n<a class=\"card card--interactive\" href=\"#\" onclick=\"event.preventDefault()\"><div class=\"card__media\"><div class=\"art a2\"><\/div><div class=\"card__badges\"><span class=\"badge badge--solid badge--error\">−20%<\/span><\/div><\/div><div class=\"card__body\"><span class=\"rating\"><svg>…<\/svg>4,7 · 54<\/span><h3 class=\"card__title\">Лампа «Глина»<\/h3><div class=\"card__foot\"><span class=\"price price--sale\">2 320 ₴<s>2 900 ₴<\/s><\/span><button class=\"btn btn--primary btn--sm btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/a>\n<div class=\"stack\" style=\"gap:20px\"><div class=\"card stat\"><span class=\"stat__label\">Виручка, листопад<\/span><div class=\"stat__value\">482 тис ₴<\/div><span class=\"badge badge--success\">↑ 12,4%<\/span><\/div>\n<div class=\"card\" aria-busy=\"true\"><div class=\"card__body\"><div class=\"skel\" style=\"height:12px;width:50%\"><\/div><div class=\"skel\" style=\"height:16px;width:90%\"><\/div><div class=\"skel\" style=\"height:28px;width:40%;margin-top:8px\"><\/div><\/div><\/div><\/div>\n<\/div>", "page": false, "summary": "Контейнер товару, статті чи показника: .card (surface, border, radius-lg)."}, {"name": "Checkout", "group": "Patterns", "height": 560, "readme": "<p>Оформлення: кроки (<code>.steps<\/code>), групи полів у картках (<code>.form-section<\/code> з <code>h4<\/code>), спосіб доставки картками-опціями (<code>.option-card<\/code> з радіо), наші <code>Select<\/code> і <code>DatePicker<\/code>, підсумок, що прилипає (<code>.summary<\/code>, sticky top 96px).<\/p>\n<p><code>.checkout<\/code> — 1fr / 400px, на планшеті одна колонка. Перевірка при натисканні «До оплати»: помилки на полях + <code>Toast<\/code>, фокус на першому полі з помилкою; кнопка показує <code>is-loading<\/code>.<\/p>\n<ul>\n<li><code>.form-section<\/code> не обрізає виступи (<code>overflow: visible<\/code>): календар і списки відкриваються поверх картки. <code>.checkout--sm<\/code> — бічна колонка 300px; на телефоні (до 640px) вона переходить під форму. Ніколи не задавайте <code>grid-template-columns<\/code> інлайном: він перебиває медіазапит.<\/li>\n<\/ul>", "code": "<div class=\"checkout checkout--sm\"><div>\n<div class=\"card form-section\"><h3>Доставка <span class=\"badge\">2 / 3<\/span><\/h3><div class=\"option-cards\"><label class=\"option-card\"><input type=\"radio\" name=\"s\" checked><span class=\"tick\"><\/span><b>Нова пошта<\/b><span>1–2 дні<\/span><span class=\"price\">70 ₴<\/span><\/label><label class=\"option-card\"><input type=\"radio\" name=\"s\"><span class=\"tick\"><\/span><b>Кур'єр<\/b><span>Київ, сьогодні<\/span><span class=\"price\">150 ₴<\/span><\/label><label class=\"option-card\"><input type=\"radio\" name=\"s\"><span class=\"tick\"><\/span><b>Самовивіз<\/b><span>Майстерня<\/span><span class=\"price\">0 ₴<\/span><\/label><\/div>\n<div class=\"form-grid\" style=\"margin-top:20px\"><div class=\"field\"><label class=\"field__label\" for=\"n\">Телефон<\/label><div class=\"input-wrap\"><span class=\"input-suffix\" style=\"left:14px;right:auto\">+380<\/span><input class=\"input\" id=\"n\" style=\"padding-left:62px\" placeholder=\"67 123 45 67\"><\/div><\/div><div class=\"field\"><label class=\"field__label\">Дата<\/label><div class=\"dp\" data-dp data-min=\"today\"><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value is-placeholder\"><svg>…<\/svg><span>Будь-яка<\/span><\/span><svg>…<\/svg><\/button><div class=\"dp__pop glass-strong\"><\/div><\/div><\/div><\/div><\/div><\/div>\n<aside class=\"card summary\" style=\"position:static\"><h3>Підсумок<\/h3><div class=\"summary__row\"><span>Товари<\/span><b>14 720 ₴<\/b><\/div><div class=\"summary__row\"><span>Доставка<\/span><b>70 ₴<\/b><\/div><div class=\"summary__total\"><span>Разом<\/span><span class=\"price\">14 790 ₴<\/span><\/div><button class=\"btn btn--primary btn--lg btn--block\" style=\"margin-top:20px\">До оплати <svg>…<\/svg><\/button><\/aside><\/div>", "page": true, "summary": "Оформлення: кроки (.steps), групи полів у картках (.form-section з h4), спосіб доставки картками-опціями (.option-card з радіо), наші Select і DatePicker, підсумок, що прилипає (.summary, sticky top 96px)."}, {"name": "Choice", "group": "Forms", "height": 250, "readme": "<p>Чекбокс, радіо й перемикач на нативних <code>input<\/code> з власним виглядом: <code>.choice<\/code> &gt; <code>input.check | .radio | .switch<\/code> + текст.<\/p>\n<ul>\n<li>Чекбокс — кілька незалежних виборів або згода; <code>indeterminate<\/code> для «вибрати всі».<\/li>\n<li>Радіо — один з 2–5 видимих варіантів; більше — <code>Select<\/code>; варіанти з ціною й описом — картки-опції (<code>.option-card<\/code>, див. Checkout).<\/li>\n<li>Перемикач (<code>role=\"switch\"<\/code>) діє одразу. Якщо потрібна кнопка «Зберегти» — це чекбокс.<\/li>\n<li>Підпис другого рядка — <code>&lt;small&gt;<\/code>. Вимкнений стан — <code>opacity .45<\/code>. Помилка групи — <code>.is-error<\/code> на контейнері.<\/li>\n<\/ul>", "code": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px\">\n<div class=\"stack\"><label class=\"choice\"><input type=\"checkbox\" class=\"check\">Не вибрано<\/label><label class=\"choice\"><input type=\"checkbox\" class=\"check\" checked>Вибрано<\/label><label class=\"choice\"><input type=\"checkbox\" class=\"check\" id=\"ind\">Частково<\/label><label class=\"choice\"><input type=\"checkbox\" class=\"check\" checked disabled>Disabled<\/label><\/div>\n<div class=\"stack\"><label class=\"choice\"><input type=\"radio\" name=\"r\" class=\"radio\" checked><span>Нова пошта<small>1–2 дні · від 70 ₴<\/small><\/span><\/label><label class=\"choice\"><input type=\"radio\" name=\"r\" class=\"radio\"><span>Самовивіз<small>Київ, безкоштовно<\/small><\/span><\/label><label class=\"choice\"><input type=\"radio\" name=\"x\" class=\"radio\" disabled>Disabled<\/label><\/div>\n<div class=\"stack\"><label class=\"choice\" style=\"align-items:center\"><input type=\"checkbox\" class=\"switch\" role=\"switch\">Вимкнено<\/label><label class=\"choice\" style=\"align-items:center\"><input type=\"checkbox\" class=\"switch\" role=\"switch\" checked>Увімкнено<\/label><label class=\"choice\" style=\"align-items:center\"><input type=\"checkbox\" class=\"switch\" role=\"switch\" disabled>Disabled<\/label><\/div>\n<\/div>", "page": false, "summary": "Чекбокс, радіо й перемикач на нативних input з власним виглядом: .choice > input.check | .radio | .switch + текст."}, {"name": "Cover", "group": "Огляд", "height": 300, "readme": "", "code": "", "page": false, "summary": ""}, {"name": "DatePicker", "group": "Forms", "height": 520, "readme": "<p>Власний календар замість <code>input type=\"date\"<\/code>: одна дата або період, у поповері зі скла чи вбудований.<\/p>\n<ul>\n<li><code>.dp[data-dp]<\/code> &gt; <code>button.select.dd__trigger<\/code> + <code>.dp__pop.glass-strong<\/code> (порожній — DS.init наповнить). Вбудований: <code>.dp.dp--inline<\/code>.<\/li>\n<li><code>data-mode=\"range\"<\/code> — період (кількість ночей у футері); <code>data-min=\"today\"<\/code> — блокує минулі дати.<\/li>\n<li>Тиждень з понеділка, місяці українською (<code>листопада<\/code>), вихідні — <code>color-accent-text<\/code>, сьогодні — кільце <code>color-secondary<\/code>, вибране — <code>color-primary<\/code>.<\/li>\n<li>Назва місяця — <code>h4<\/code> (Ermilov). Стрілки навігації круглі (<code>--btn-radius: radius-full<\/code>).<\/li>\n<li>Клавіатура: стрілки — день/тиждень, PageUp/PageDown — місяць, Home/End — тиждень, Enter — вибір, Esc — закрити. Подія <code>dp:change<\/code> {start, end}.<\/li>\n<li>До 640px календар відкривається шторкою знизу: клітинки 44px, затемнення позаду, закриття кліком по ньому або Esc. Картка-батько не обрізає календар (<code>.card<\/code> з відкритим <code>.dp<\/code> стає <code>overflow: visible<\/code>).<\/li>\n<\/ul>", "code": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start\">\n<div class=\"stack\"><div class=\"field\"><label class=\"field__label\">Дата доставки<\/label><div class=\"dp\" data-dp data-min=\"today\"><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value is-placeholder\"><svg>…<\/svg><span>Оберіть дату<\/span><\/span><svg>…<\/svg><\/button><div class=\"dp__pop glass-strong\"><\/div><\/div><\/div>\n<div class=\"field\"><label class=\"field__label\">Період<\/label><div class=\"dp\" data-dp data-mode=\"range\" data-min=\"today\"><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value is-placeholder\"><svg>…<\/svg><span>Заїзд — виїзд<\/span><\/span><svg>…<\/svg><\/button><div class=\"dp__pop glass-strong\"><\/div><\/div><\/div><\/div>\n<div class=\"dp dp--inline\" data-dp data-mode=\"range\"><div class=\"dp__pop\" style=\"width:100%;max-width:340px;padding:0\"><\/div><\/div>\n<\/div>", "page": false, "summary": "Власний календар замість input type=\"date\": одна дата або період, у поповері зі скла чи вбудований."}, {"name": "Field", "group": "Forms", "height": 330, "readme": "<p>Поле вводу з міткою й підказкою: <code>.field<\/code> &gt; <code>.field__label<\/code> + <code>.input | .textarea<\/code> + <code>.field__help<\/code>.<\/p>\n<ul>\n<li>Мітка завжди над полем; placeholder — лише приклад. Необов'язкові позначаємо <code>&lt;span class=\"opt\"&gt;· необов'язково&lt;/span&gt;<\/code>, обов'язкові — ні.<\/li>\n<li>Помилка: <code>.field.is-error<\/code>; текст <code>.field__help<\/code> пояснює, як виправити («Введіть 9 цифр номера»), а не «Помилка».<\/li>\n<li>Іконка ліворуч: <code>.input-wrap<\/code> &gt; svg + <code>.input<\/code>; суфікс (₴, кг) — <code>.input-suffix<\/code>.<\/li>\n<li>Шрифт 16px (<code>body-m<\/code>), висота 44px, <code>radius-md<\/code>, рамка <code>border-input<\/code> кольору <code>color-border-strong<\/code>, фон <code>input-bg<\/code>.<\/li>\n<li>Для вибору зі списку — <code>Select<\/code>, для дат — <code>DatePicker<\/code>; системні <code>&lt;select&gt;<\/code> і <code>type=\"date\"<\/code> не використовуємо.<\/li>\n<\/ul>", "code": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n<div class=\"field\"><label class=\"field__label\" for=\"a\">Ім'я<\/label><input class=\"input\" id=\"a\" placeholder=\"Олена\"><span class=\"field__help\">Як у паспорті<\/span><\/div>\n<div class=\"field\"><label class=\"field__label\" for=\"b\">Focus<\/label><input class=\"input is-focus\" id=\"b\" value=\"Олена Коваленко\"><span class=\"field__help\">Рамка primary + м'яке кільце<\/span><\/div>\n<div class=\"field is-error\"><label class=\"field__label\" for=\"c\">Email<\/label><input class=\"input\" id=\"c\" value=\"olena@\" aria-invalid=\"true\"><span class=\"field__help\">Введіть email повністю, напр. olena@mail.com<\/span><\/div>\n<div class=\"field\"><label class=\"field__label\" for=\"d\">Пошук<\/label><div class=\"input-wrap\"><svg>…<\/svg><input class=\"input\" id=\"d\" placeholder=\"Пошук товарів\"><\/div><\/div>\n<div class=\"field\"><label class=\"field__label\" for=\"e\">Сума <span class=\"opt\">· необов'язково<\/span><\/label><div class=\"input-wrap\"><input class=\"input\" id=\"e\" value=\"1 250\"><span class=\"input-suffix\">₴<\/span><\/div><\/div>\n<div class=\"field\"><label class=\"field__label\" for=\"f\">Disabled<\/label><input class=\"input\" id=\"f\" value=\"Недоступно\" disabled><\/div>\n<div class=\"field\" style=\"grid-column:1/-1\"><label class=\"field__label\" for=\"g\">Коментар<\/label><textarea class=\"textarea\" id=\"g\" placeholder=\"Напр., зателефонуйте за годину\"><\/textarea><\/div>\n<\/div>", "page": false, "summary": "Поле вводу з міткою й підказкою: .field > .field__label + .input | .textarea + .field__help."}, {"name": "Footer", "group": "Patterns", "height": 520, "readme": "<p>Футер: опис і соцмережі, три колонки посилань (заголовки — eyebrow), величезне слово-знак <code>.footer__word<\/code> (Ermilov, крапка <code>color-primary<\/code>), юридичний рядок з авторами шрифтів (вимога ліцензії KyivType).<\/p>", "code": "<footer class=\"footer\" style=\"padding-top:24px\"><div class=\"footer__top\"><div class=\"footer__about\"><a class=\"navbar__logo\" href=\"#\">Ліс<\/a><p>Меблі з масиву, зроблені вручну в Карпатах.<\/p><div class=\"footer__social\"><a class=\"btn btn--outline btn--icon\" href=\"#\" aria-label=\"Instagram\"><svg>…<\/svg><\/a><a class=\"btn btn--outline btn--icon\" href=\"#\" aria-label=\"Telegram\"><svg>…<\/svg><\/a><\/div><\/div>\n<div><h4>Каталог<\/h4><ul><li><a href=\"#\">Крісла<\/a><\/li><li><a href=\"#\">Столи<\/a><\/li><li><a href=\"#\">Світло<\/a><\/li><\/ul><\/div><div><h4>Компанія<\/h4><ul><li><a href=\"#\">Про нас<\/a><\/li><li><a href=\"#\">Журнал<\/a><\/li><\/ul><\/div><div><h4>Допомога<\/h4><ul><li><a href=\"#\">Доставка<\/a><\/li><li><a href=\"#\">Повернення<\/a><\/li><\/ul><\/div><\/div>\n<div class=\"footer__word\" aria-hidden=\"true\" style=\"font-size:150px\">Ліс<span>.<\/span><\/div><div class=\"footer__legal\"><span>© 2026 Ліс<\/span><span>Ermilov — Kyrylo Tkachov · KyivType Sans — Dmitry Rastvortsev, CC BY-ND 4.0<\/span><\/div><\/footer>", "page": true, "summary": "Футер: опис і соцмережі, три колонки посилань (заголовки — eyebrow), величезне слово-знак .footer__word (Ermilov, крапка color-primary), юридичний рядок з авторами шрифтів (вимога ліцензії KyivType). "}, {"name": "Glass", "group": "Material", "height": 300, "readme": "<p>Скляний матеріал (у дусі Liquid Glass з iOS 26) для шару, що плаває над контентом: <code>.glass<\/code> і щільніший <code>.glass-strong<\/code>.<\/p>\n<h2>Де<\/h2>\n<p>Сегментовані перемикачі, навбар, тулбари над фото чи мапою, меню й списки, календар, тултіпи, сповіщення, панель масових дій, hover прозорих кнопок і тегів.<\/p>\n<h2>Де ні<\/h2>\n<p>Основні поверхні, картки в сітці, форми, модальні вікна, основні кнопки. Скло на склі.<\/p>\n<h2>Як<\/h2>\n<ul>\n<li>Розмиття 22px + насичення (<code>--glass-blur<\/code>, <code>--glass-sat<\/code>), тонований фон <code>glass-tint<\/code> / <code>glass-tint-strong<\/code>, обідок <code>glass-rim<\/code>, блік <code>glass-spec<\/code>, тінь <code>glass-shadow<\/code>.<\/li>\n<li>Текст на склі — лише на <code>glass-strong<\/code> (контраст стабільний над будь-яким фоном).<\/li>\n<li>Концентричні кути: у капсулі (<code>radius-full<\/code>) усе всередині — капсули, клас <code>.pill-group<\/code>.<\/li>\n<li>При «зменшити прозорість» у системі скло стає щільною поверхнею <code>color-surface-raised<\/code>.<\/li>\n<li>Ефект видно над насиченим фоном; на рівному фоні це легкий блік — так і задумано.<\/li>\n<\/ul>", "code": "<div style=\"position:relative;border-radius:var(--radius-xl);overflow:hidden;padding:24px;min-height:260px\"><div class=\"stagebg\"><span class=\"blob b1\"><\/span><span class=\"blob b2\"><\/span><span class=\"blob b3\"><\/span><div style=\"position:absolute;left:4%;top:28%;font:700 clamp(56px,16vw,96px)/.9 var(--font-display);text-transform:uppercase;color:var(--color-text);opacity:.9\">Природа<\/div><\/div>\n<div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;align-items:start\">\n<div class=\"glass\" style=\"border-radius:var(--radius-xl);padding:20px\"><div class=\"t-eyebrow\" style=\"color:var(--color-accent-text)\">glass<\/div><div class=\"t-h3\" style=\"margin:8px 0\">Скляна картка<\/div><p style=\"margin:0;font:var(--text-body-s)\" class=\"t-muted\">Над фото й банерами.<\/p><\/div>\n<div class=\"stack\" style=\"align-items:flex-start\"><div class=\"glass pill-group\" style=\"display:flex;gap:2px;padding:6px;border-radius:999px\"><button class=\"btn btn--ghost btn--icon\" aria-label=\"Обране\"><svg>…<\/svg><\/button><button class=\"btn btn--ghost btn--icon is-hover\" aria-label=\"Поділитися\"><svg>…<\/svg><\/button><button class=\"btn btn--ghost btn--sm\"><svg>…<\/svg>Додати<\/button><\/div>\n<div class=\"glass-strong\" style=\"padding:14px 18px;border-radius:var(--radius-lg);font:var(--text-body-s)\"><b>glass-strong<\/b> — меню, списки, календар, toast<\/div><\/div><\/div><\/div>", "page": false, "summary": "Скляний матеріал (у дусі Liquid Glass з iOS 26) для шару, що плаває над контентом: .glass і щільніший .glass-strong."}, {"name": "Hero", "group": "Patterns", "height": 560, "readme": "<p>Перший екран: теза великими літерами (<code>display-xl<\/code>, друге слово — <code>color-primary<\/code> через <code>&lt;em&gt;<\/code>), лід <code>body-l<\/code>, дві дії, медіа зі скляною плашкою товару, рядок цифр (<code>.hero__stats<\/code>, Ermilov).<\/p>\n<p><code>section.hero &gt; .container &gt; .hero__grid<\/code> (1.15fr / .85fr, на мобільному одна колонка). Висота — за контентом, не 100vh. Одна primary-кнопка.<\/p>", "code": "<section class=\"hero\" style=\"margin-top:0;padding:0\"><div class=\"hero__grid\"><div><span class=\"badge badge--brand badge--dot\">Колекція Осінь 2026<\/span><h1 class=\"hero__title\">Меблі, що <em>ростуть<\/em> з вами<\/h1><p class=\"hero__lead\">Масив дуба й ясена з Карпат, шипові з'єднання без металу й натуральна олія.<\/p><div class=\"hero__actions\"><a class=\"btn btn--primary btn--lg\" href=\"#\">Дивитися каталог <svg>…<\/svg><\/a><a class=\"btn btn--ghost btn--lg\" href=\"#\">Як ми працюємо<\/a><\/div><\/div>\n<div class=\"hero__media\" style=\"aspect-ratio:4/4\"><div class=\"art a5\"><\/div><div class=\"hero__float glass\"><div style=\"flex:1;min-width:0\"><div style=\"font:600 14px/1.3 var(--font-body)\">Крісло «Дуб»<\/div><div style=\"font:var(--text-caption);color:var(--color-text-muted)\">Хіт сезону<\/div><\/div><span class=\"price\">12 400 ₴<\/span><button class=\"btn btn--primary btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/div>\n<div class=\"hero__stats\"><div><b>12 480<\/b><span>замовлень у 2026<\/span><\/div><div><b>10 років<\/b><span>гарантії<\/span><\/div><div><b>97%<\/b><span>повертаються<\/span><\/div><\/div><\/section>", "page": true, "summary": "Перший екран: теза великими літерами (display-xl, друге слово — color-primary через <em>), лід body-l, дві дії, медіа зі скляною плашкою товару, рядок цифр (.hero__stats, Ermilov)."}, {"name": "Link", "group": "Actions", "height": 110, "readme": "<p>Текстове посилання: колір <code>color-accent-text<\/code>, підкреслення 1px з відступом 3px, при наведенні 2px.<\/p>\n<ul>\n<li><code>.link<\/code> — у тексті; <code>.link--quiet<\/code> — футер, метадані (колір тексту, лінія <code>color-border-strong<\/code>).<\/li>\n<li>Підкреслення не прибирати: колір сам по собі не розрізняють люди з порушенням кольоросприйняття.<\/li>\n<li>Дія, а не перехід → <code>Button<\/code> з <code>btn--ghost<\/code>.<\/li>\n<\/ul>", "code": "<p style=\"margin:0;max-width:60ch\">Посилання в тексті: <a href=\"#\" class=\"link\">дізнатися більше про матеріали<\/a>. Наведення: <a href=\"#\" class=\"link is-hover\">товща лінія<\/a>. Тихе — для футера: <a href=\"#\" class=\"link link--quiet\">Політика конфіденційності<\/a>.<\/p>", "page": false, "summary": "Текстове посилання: колір color-accent-text, підкреслення 1px з відступом 3px, при наведенні 2px."}, {"name": "Modal", "group": "Overlays", "height": 440, "readme": "<p>Модальне вікно й бокова панель. Вікно щільне (<code>surface-3<\/code>, <code>elevation-4<\/code>, <code>radius-xl<\/code>) — це контент, не скло; фон затемнюється й розмивається.<\/p>\n<ul>\n<li><code>.modal#id<\/code> &gt; <code>.modal__overlay<\/code> + <code>.modal__dialog<\/code> &gt; <code>.modal__head<\/code> (<code>.modal__title<\/code> — h3 Ermilov, <code>.modal__close<\/code>) + <code>.modal__body<\/code> + <code>.modal__foot<\/code>.<\/li>\n<li>Відкрити: кнопка з <code>data-open=\"id\"<\/code> або <code>DS.modal(id).open()<\/code>. Закрити: <code>[data-close]<\/code>, Esc, клік по фону.<\/li>\n<li>Фокус утримується у вікні й повертається на кнопку; сторінка не прокручується. Підтвердження — <code>data-role=\"alertdialog\"<\/code>, <code>.modal__icon<\/code>, <code>autofocus<\/code> на безпечній дії.<\/li>\n<li>Бокова панель: <code>.modal--drawer<\/code> (праворуч) або <code>.from-left<\/code> (мобільне меню, можна <code>.glass-strong<\/code>). До 640px вікно виїжджає знизу шторкою на всю ширину.<\/li>\n<\/ul>", "code": "<div class=\"row\"><button class=\"btn btn--danger\" data-open=\"m1\"><svg>…<\/svg>Видалити замовлення<\/button><button class=\"btn btn--outline\" data-open=\"m2\"><svg>…<\/svg>Кошик (панель)<\/button><\/div>\n<div class=\"modal\" id=\"m1\" data-role=\"alertdialog\"><div class=\"modal__overlay\"><\/div><div class=\"modal__dialog\"><div class=\"modal__head\"><div><div class=\"modal__icon\"><svg>…<\/svg><\/div><h2 class=\"modal__title\">Видалити замовлення?<\/h2><\/div><button class=\"btn btn--ghost btn--icon modal__close\" data-close aria-label=\"Закрити\"><svg>…<\/svg><\/button><\/div><div class=\"modal__body\"><p>Замовлення № 10482 буде видалено разом з історією оплат. Цю дію не можна скасувати.<\/p><\/div><div class=\"modal__foot\"><button class=\"btn btn--ghost\" data-close autofocus>Скасувати<\/button><button class=\"btn btn--danger\" data-close>Видалити<\/button><\/div><\/div><\/div>\n<div class=\"modal modal--drawer\" id=\"m2\"><div class=\"modal__overlay\"><\/div><div class=\"modal__dialog\"><div class=\"modal__head\"><h2 class=\"modal__title\">Кошик · 2<\/h2><button class=\"btn btn--ghost btn--icon modal__close\" data-close aria-label=\"Закрити\"><svg>…<\/svg><\/button><\/div><div class=\"modal__body\"><p>Крісло «Дуб» · 12 400 ₴<br>Лампа «Глина» · 2 320 ₴<\/p><\/div><div class=\"modal__foot\"><button class=\"btn btn--primary btn--lg btn--block\">Оформити <svg>…<\/svg><\/button><\/div><\/div><\/div>", "page": false, "summary": "Модальне вікно й бокова панель. Вікно щільне (surface-3, elevation-4, radius-xl) — це контент, не скло; фон затемнюється й розмивається."}, {"name": "Navbar", "group": "Navigation", "height": 230, "readme": "<p>Скляна капсула головної навігації: логотип, посилання, дії. <code>nav.navbar.glass<\/code> &gt; <code>.navbar__logo<\/code> + <code>.navbar__links<\/code> + <code>.navbar__actions<\/code>.<\/p>\n<ul>\n<li>Активний пункт — <code>aria-current=\"page\"<\/code> (скляна «крапля» <code>glass-thumb<\/code>). Кути концентричні: кнопки всередині — капсули.<\/li>\n<li>До 860px посилання й <code>.navbar__hide-sm<\/code> ховаються, з'являється <code>.navbar__burger<\/code>, що відкриває <code>Modal<\/code> <code>.modal--drawer.from-left<\/code> зі списком <code>.nav-list<\/code> (Ermilov 22px, великими).<\/li>\n<li>На сторінці — у <code>.site-header<\/code> (sticky, <code>z-sticky<\/code>, ховається при прокрутці вниз). Логотип — слово «Ліс» в Ermilov, поки немає знака.<\/li>\n<li>На телефоні основні розділи краще винести в <code>TabBar<\/code> унизу екрана, а в шапці лишити назву, пошук і кошик (<code>.navbar--compact<\/code>). Див. розділ «Мобільна версія».<\/li>\n<\/ul>", "code": "<div style=\"position:relative;border-radius:var(--radius-xl);overflow:hidden;padding:14px;min-height:190px\"><div class=\"stagebg\"><span class=\"blob b1\"><\/span><span class=\"blob b2\"><\/span><span class=\"blob b3\"><\/span><\/div>\n<nav class=\"navbar glass\" aria-label=\"Головна\" style=\"position:relative\"><a class=\"navbar__logo\" href=\"#\">Ліс<\/a><div class=\"navbar__links\"><a class=\"btn btn--ghost btn--sm\" href=\"#\" aria-current=\"page\">Каталог<\/a><a class=\"btn btn--ghost btn--sm\" href=\"#\">Матеріали<\/a><a class=\"btn btn--ghost btn--sm\" href=\"#\">Журнал<\/a><\/div><div class=\"navbar__actions\"><button class=\"btn btn--ghost btn--sm btn--icon navbar__hide-sm\" aria-label=\"Пошук\"><svg>…<\/svg><\/button><button class=\"btn btn--ghost btn--sm\" aria-label=\"Кошик\"><svg>…<\/svg><span class=\"badge badge--count\">2<\/span><\/button><button class=\"btn btn--ghost btn--sm btn--icon navbar__burger\" aria-label=\"Меню\"><svg>…<\/svg><\/button><\/div><\/nav>\n<nav class=\"navbar navbar--compact glass\" style=\"position:relative;margin-top:14px;max-width:380px\"><a class=\"navbar__logo\" href=\"#\">Ліс<\/a><div class=\"navbar__actions\"><button class=\"btn btn--ghost btn--sm\" aria-label=\"Кошик\"><svg>…<\/svg><span class=\"badge badge--count\">2<\/span><\/button><button class=\"btn btn--ghost btn--sm btn--icon navbar__burger\" aria-label=\"Меню\"><svg>…<\/svg><\/button><\/div><\/nav><\/div>", "page": false, "summary": "Скляна капсула головної навігації: логотип, посилання, дії. nav.navbar.glass > .navbar__logo + .navbar__links + .navbar__actions."}, {"name": "Pagination", "group": "Navigation", "height": 80, "readme": "<p>Капсула сторінок: <code>.pager<\/code> &gt; <code>button.btn.btn--ghost<\/code>, поточна — <code>aria-current=\"page\"<\/code> (заливка <code>color-primary<\/code>), розрив — <code>.pager__gap<\/code>.\nДля таблиць і пошуку. Для стрічки товарів краще кнопка «Показати ще».<\/p>", "code": "<nav aria-label=\"Сторінки\"><div class=\"pager\"><button class=\"btn btn--ghost btn--icon\" aria-label=\"Попередня\"><svg>…<\/svg><\/button><button class=\"btn btn--ghost\">1<\/button><button class=\"btn btn--ghost\">2<\/button><button class=\"btn btn--ghost\" aria-current=\"page\">3<\/button><button class=\"btn btn--ghost\">4<\/button><span class=\"pager__gap\">…<\/span><button class=\"btn btn--ghost\">12<\/button><button class=\"btn btn--ghost btn--icon\" aria-label=\"Наступна\"><svg>…<\/svg><\/button><\/div><\/nav>", "page": false, "summary": "Капсула сторінок: .pager > button.btn.btn--ghost, поточна — aria-current=\"page\" (заливка color-primary), розрив — .pager__gap. Для таблиць і пошуку. Для стрічки товарів краще кнопка «Показати ще». "}, {"name": "ProductSection", "group": "Patterns", "height": 520, "readme": "<p>Секція каталогу: <code>.section__head<\/code> (eyebrow + <code>h1<\/code>-заголовок великими + посилання «Усі»), фільтри-теги (<code>.filters<\/code>), <code>.product-grid<\/code> (4 → 2 → 1 колонки), «Показати ще» (<code>.more<\/code>).<\/p>\n<p>Відступ секції — <code>space-section<\/code>; між заголовком і сіткою — <code>space-10<\/code>. Додавання в кошик — <code>Toast<\/code> з дією «Відкрити кошик».<\/p>", "code": "<div class=\"section__head\" style=\"margin-bottom:24px\"><div><span class=\"section__eyebrow\">Каталог<\/span><h2 class=\"section__title\">Популярне зараз<\/h2><\/div><a class=\"btn btn--outline\" href=\"#\">Усі товари <svg>…<\/svg><\/a><\/div>\n<div class=\"filters\"><button class=\"tag is-selected\" aria-pressed=\"true\">Усі<\/button><button class=\"tag\" aria-pressed=\"false\">Крісла<\/button><button class=\"tag\" aria-pressed=\"false\">Світло<\/button><\/div>\n<div class=\"product-grid product-grid--3\">\n<a class=\"card card--interactive\" href=\"#\" onclick=\"event.preventDefault()\"><div class=\"card__media\"><div class=\"art a1\"><\/div><\/div><div class=\"card__body\"><h3 class=\"card__title\">Крісло «Дуб»<\/h3><div class=\"card__foot\"><span class=\"price\">12 400 ₴<\/span><button class=\"btn btn--primary btn--sm btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/a>\n<a class=\"card card--interactive\" href=\"#\" onclick=\"event.preventDefault()\"><div class=\"card__media\"><div class=\"art a2\"><\/div><\/div><div class=\"card__body\"><h3 class=\"card__title\">Лампа «Глина»<\/h3><div class=\"card__foot\"><span class=\"price\">2 320 ₴<\/span><button class=\"btn btn--primary btn--sm btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/a>\n<a class=\"card card--interactive\" href=\"#\" onclick=\"event.preventDefault()\"><div class=\"card__media\"><div class=\"art a3\"><\/div><\/div><div class=\"card__body\"><h3 class=\"card__title\">Кошик плетений<\/h3><div class=\"card__foot\"><span class=\"price\">1 850 ₴<\/span><button class=\"btn btn--primary btn--sm btn--icon\" aria-label=\"В кошик\"><svg>…<\/svg><\/button><\/div><\/div><\/a><\/div>", "page": true, "summary": "Секція каталогу: .section__head (eyebrow + h1-заголовок великими + посилання «Усі»), фільтри-теги (.filters), .product-grid (4 → 2 → 1 колонки), «Показати ще» (.more)."}, {"name": "SegmentedControl", "group": "Forms", "height": 110, "readme": "<p>Скляний перемикач 2–4 рівноцінних варіантів зі скляною «краплею» (<code>glass-thumb<\/code>), що перетікає між ними.<\/p>\n<ul>\n<li><code>.segmented.glass[role=group][aria-label]<\/code> &gt; <code>button.segmented__btn[aria-pressed]<\/code> (+ <code>data-value<\/code>).<\/li>\n<li>Для перемикання вигляду, теми, періоду. Для розділів контенту — <code>Tabs<\/code>.<\/li>\n<li>Стрілки ←→ перемикають. Подія <code>seg:change<\/code> {value}; програмно — <code>el._c.set(value)<\/code>.<\/li>\n<\/ul>", "code": "<div class=\"row\"><div class=\"segmented glass\" role=\"group\" aria-label=\"Тема\"><button class=\"segmented__btn\" data-value=\"dark\" aria-pressed=\"true\"><svg>…<\/svg>Темна<\/button><button class=\"segmented__btn\" data-value=\"light\" aria-pressed=\"false\"><svg>…<\/svg>Світла<\/button><\/div>\n<div class=\"segmented glass\" role=\"group\" aria-label=\"Вигляд\"><button class=\"segmented__btn\" aria-pressed=\"true\"><svg>…<\/svg>Сітка<\/button><button class=\"segmented__btn\" aria-pressed=\"false\"><svg>…<\/svg>Список<\/button><button class=\"segmented__btn\" aria-pressed=\"false\"><svg>…<\/svg>Мапа<\/button><\/div><\/div>", "page": false, "summary": "Скляний перемикач 2–4 рівноцінних варіантів зі скляною «краплею» (glass-thumb), що перетікає між ними."}, {"name": "Select", "group": "Forms", "height": 380, "readme": "<p>Власний випадний список і меню дій зі скляним меню (<code>glass-strong<\/code>). Замінює системний <code>&lt;select&gt;<\/code>.<\/p>\n<h2>Розмітка<\/h2>\n<p><code>.dd[data-dd]<\/code> &gt; <code>button.select.dd__trigger<\/code> (з <code>.dd__value<\/code>) + <code>.dd__menu.glass-strong<\/code> &gt; <code>.dd__opt[data-value]<\/code>.\nМеню дій: <code>data-dd=\"menu\"<\/code>, тригер — будь-яка <code>.btn<\/code>. Початкове значення — <code>data-value<\/code> на <code>.dd<\/code>.<\/p>\n<h2>Варіанти<\/h2>\n<ul>\n<li>Опис і іконка: <code>&lt;svg class=\"lead-ic\"&gt;<\/code> + <code>&lt;small&gt;<\/code> усередині пункту; <code>data-label<\/code> — що показати в тригері.<\/li>\n<li>Пошук: <code>.dd__search<\/code> першим у меню; групи — <code>.dd__group<\/code>; роздільник — <code>.dd__sep<\/code>; небезпечний пункт — <code>.dd__opt--danger<\/code>; гаряча клавіша — <code>&lt;kbd&gt;<\/code>.<\/li>\n<li>Недоступний варіант: <code>aria-disabled=\"true\"<\/code> (видно, але не вибрати). Помилка: <code>.field.is-error<\/code>.<\/li>\n<li>Праворуч від тригера: <code>.dd--right<\/code>. Меню само відкривається вгору біля краю екрана.<\/li>\n<\/ul>\n<h2>Поведінка (DS.init)<\/h2>\n<p>↑↓ Home End, Enter/Space — вибір, Esc — закрити, літери — пошук за початком. ARIA listbox/menu. Подія <code>dd:change<\/code> {value, label}.\nПункти мають <code>radius-md<\/code> (концентрично до меню <code>radius-lg<\/code> з відступом 6px).<\/p>\n<ul>\n<li>До 640px список (і меню дій) відкривається шторкою знизу: рядки 48px, затемнення позаду. Поле пошуку не викликає клавіатуру саме — фокус на ньому після натиску.<\/li>\n<\/ul>", "code": "<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n<div class=\"field\"><label class=\"field__label\">Простий<\/label><div class=\"dd\" data-dd><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value is-placeholder\"><span>Оберіть розмір<\/span><\/span><svg>…<\/svg><\/button><div class=\"dd__menu glass-strong\"><div class=\"dd__opt\" data-value=\"s\">S · 44–46<\/div><div class=\"dd__opt\" data-value=\"m\">M · 48–50<\/div><div class=\"dd__opt\" data-value=\"l\">L · 52–54<\/div><div class=\"dd__opt\" data-value=\"xl\" aria-disabled=\"true\">XL · немає<\/div><\/div><\/div><\/div>\n<div class=\"field\"><label class=\"field__label\">З описом<\/label><div class=\"dd\" data-dd data-value=\"np\"><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value\"><span><\/span><\/span><svg>…<\/svg><\/button><div class=\"dd__menu glass-strong\">\n<div class=\"dd__opt\" data-value=\"np\" data-label=\"Нова пошта\"><svg>…<\/svg><span>Нова пошта<small>1–2 дні · від 70 ₴<\/small><\/span><\/div><div class=\"dd__opt\" data-value=\"up\" data-label=\"Укрпошта\"><svg>…<\/svg><span>Укрпошта<small>3–5 днів · від 45 ₴<\/small><\/span><\/div><\/div><\/div><\/div>\n<div class=\"field\"><label class=\"field__label\">З пошуком<\/label><div class=\"dd\" data-dd><button type=\"button\" class=\"select dd__trigger\"><span class=\"dd__value is-placeholder\"><span>Місто<\/span><\/span><svg>…<\/svg><\/button><div class=\"dd__menu glass-strong\"><div class=\"dd__search\"><div class=\"input-wrap\"><svg>…<\/svg><input class=\"input\" placeholder=\"Пошук\" aria-label=\"Пошук міста\"><\/div><\/div><div class=\"dd__group\">Популярні<\/div><div class=\"dd__opt\" data-value=\"kyiv\">Київ<\/div><div class=\"dd__opt\" data-value=\"lviv\">Львів<\/div><div class=\"dd__group\">Усі<\/div><div class=\"dd__opt\" data-value=\"dnipro\">Дніпро<\/div><div class=\"dd__opt\" data-value=\"uzh\">Ужгород<\/div><\/div><\/div><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:20px\"><div class=\"dd\" data-dd=\"menu\"><button type=\"button\" class=\"btn btn--outline dd__trigger\">Дії <svg>…<\/svg><\/button><div class=\"dd__menu glass-strong\" style=\"min-width:220px\"><div class=\"dd__opt\" data-value=\"e\"><svg>…<\/svg>Редагувати<kbd>E<\/kbd><\/div><div class=\"dd__opt\" data-value=\"c\"><svg>…<\/svg>Дублювати<\/div><div class=\"dd__sep\"><\/div><div class=\"dd__opt dd__opt--danger\" data-value=\"d\"><svg>…<\/svg>Видалити<\/div><\/div><\/div><\/div>", "page": false, "summary": "Власний випадний список і меню дій зі скляним меню (glass-strong). Замінює системний <select>."}, {"name": "TabBar", "group": "Navigation", "height": 520, "readme": "<p>Нижня навігація для телефона: скляна капсула внизу екрана з 3–5 розділами верхнього рівня, як у застосунках iOS 26. <code>nav.tabbar.glass<\/code> &gt; <code>a.tabbar__item<\/code> (іконка + підпис).<\/p>\n<ul>\n<li>Активний розділ — <code>aria-current=\"page\"<\/code> (скляна «крапля» <code>glass-thumb<\/code>, іконка <code>color-primary<\/code>). Підпис видно завжди: іконка без тексту нечитна. Лічильник — <code>.tabbar__badge<\/code> (accent) із <code>aria-label<\/code>.<\/li>\n<li><code>position: fixed<\/code> унизу, відступ <code>12px + var(--safe-bottom)<\/code>, <code>z-sticky<\/code>. Капсула <code>radius-full<\/code>, пункти всередині теж капсули (концентрично). Висота пункту 52px — понад зону натиску 44px (<code>--touch-target<\/code>).<\/li>\n<li>Додайте <code>.has-tabbar<\/code> на <code>body<\/code>: нижній відступ <code>--tabbar-height + --safe-bottom<\/code>, щоб останній блок не ховався під капсулою. Якщо <code>.tabbar--mobile<\/code> лежить прямо в <code>body<\/code>, відступ додається сам і лише на телефоні. Тости, шторки й модалки піднімаються над tabbar самі.<\/li>\n<li><code>.tabbar--mobile<\/code> — показувати лише до 640px (на десктопі працює <code>Navbar<\/code>). <code>.tabbar--static<\/code> — не фіксувати (макети, превʼю).<\/li>\n<li>Не більше 5 пунктів; п'ятий може бути «Ще» зі шторкою <code>Modal<\/code> для рідкісних розділів. Одна дія «створити» — це кнопка на екрані, а не вкладка. Назви — один іменник: «Каталог», «Кошик».<\/li>\n<li>Клавіатура й екранні читачі: це звичайні посилання; роутер ставить <code>aria-current<\/code> сам.<\/li>\n<\/ul>", "code": "<p class=\"pv-label\">Темна й світла — перемикач теми зверху. Клік по пункту змінює aria-current.<\/p>\n<div class=\"stage\">\n <div class=\"phone\"><div class=\"phone__bar\">Ліс<\/div>\n  <div class=\"phone__body\"><div class=\"sk h\"><\/div><div class=\"sk s\"><\/div><div class=\"sk\"><\/div><div class=\"sk\"><\/div><\/div>\n  <nav class=\"tabbar glass\" aria-label=\"Основна навігація\" id=\"tb1\">\n   <a class=\"tabbar__item\" href=\"#\" aria-current=\"page\"><svg>…<\/svg><span>Головна<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Каталог<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Кошик<\/span><span class=\"tabbar__badge\" aria-label=\"2 товари\">2<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Профіль<\/span><\/a>\n  <\/nav><\/div>\n <div class=\"phone\"><div class=\"phone__bar\">Ліс<\/div>\n  <div class=\"phone__body\"><div class=\"sk\"><\/div><div class=\"sk\"><\/div><div class=\"sk s\"><\/div><div class=\"sk\"><\/div><\/div>\n  <nav class=\"tabbar glass\" aria-label=\"П'ять розділів\" id=\"tb2\">\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Головна<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\" aria-current=\"page\"><svg>…<\/svg><span>Каталог<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Обране<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Кошик<\/span><span class=\"tabbar__badge\" aria-label=\"12 товарів\">12<\/span><\/a>\n   <a class=\"tabbar__item\" href=\"#\"><svg>…<\/svg><span>Ще<\/span><\/a>\n  <\/nav><\/div>\n<\/div>", "page": false, "summary": "Нижня навігація для телефона: скляна капсула внизу екрана з 3–5 розділами верхнього рівня, як у застосунках iOS 26. nav.tabbar.glass > a.tabbar__item (іконка + підпис)."}, {"name": "Table", "group": "Content", "height": 420, "readme": "<p>Таблиця даних: пошук, сортування, вибір рядків із масовими діями. <code>.table-card[data-table]<\/code> &gt; <code>.table-toolbar<\/code> + <code>.table-scroll &gt; table.table<\/code> + <code>.table-foot<\/code> + <code>.bulkbar<\/code>.<\/p>\n<ul>\n<li>Сортування: <code>th &gt; button.th-sort<\/code> (+ <code>data-type=\"num\"<\/code>); значення для сортування — <code>data-v<\/code> на клітинці. <code>aria-sort<\/code> ставить DS.<\/li>\n<li>Вибір: перша колонка <code>.w-check<\/code> з <code>.check<\/code>; масові дії — скляна <code>.bulkbar<\/code> внизу екрана (<code>z-sticky<\/code>).<\/li>\n<li>Пошук: <code>input[data-filter]<\/code>; порожній результат — <code>[data-empty]<\/code>.<\/li>\n<li>Цифри праворуч (<code>.num<\/code>), <code>tabular-nums<\/code>; статуси — <code>badge--dot<\/code>; дії рядка — <code>Select<\/code> з <code>data-dd=\"menu\"<\/code>.<\/li>\n<li>На вузьких екранах таблиця гортається вбік усередині <code>.table-scroll<\/code> (min-width 720px).<\/li>\n<\/ul>", "code": "<div class=\"table-card\" data-table style=\"position:relative\"><div class=\"table-toolbar\"><div class=\"input-wrap\"><svg>…<\/svg><input class=\"input\" placeholder=\"Пошук замовлень\" data-filter aria-label=\"Пошук\"><\/div><button class=\"btn btn--primary btn--sm\"><svg>…<\/svg>Нове<\/button><\/div>\n<div class=\"table-scroll\"><table class=\"table\"><thead><tr><th class=\"w-check\"><input type=\"checkbox\" class=\"check\" aria-label=\"Вибрати всі\"><\/th><th><button class=\"th-sort\">Замовлення <svg>…<\/svg><\/button><\/th><th><button class=\"th-sort\">Клієнт <svg>…<\/svg><\/button><\/th><th>Статус<\/th><th class=\"num\" data-type=\"num\"><button class=\"th-sort\">Сума <svg>…<\/svg><\/button><\/th><\/tr><\/thead><tbody>\n<tr><td class=\"w-check\"><input type=\"checkbox\" class=\"check\" aria-label=\"10482\"><\/td><td><span class=\"strong\">№ 10482<\/span><\/td><td data-v=\"Олена\"><div class=\"cell-user\"><span class=\"avatar\" style=\"background:var(--forest-300)\">ОК<\/span><div><span class=\"strong\" style=\"font-size:14px\">Олена Коваленко<\/span><span class=\"sub\">Київ<\/span><\/div><\/div><\/td><td><span class=\"badge badge--dot badge--info\">Нове<\/span><\/td><td class=\"num\" data-v=\"14720\"><span class=\"strong\">14 720 ₴<\/span><\/td><\/tr>\n<tr><td class=\"w-check\"><input type=\"checkbox\" class=\"check\" aria-label=\"10481\"><\/td><td><span class=\"strong\">№ 10481<\/span><\/td><td data-v=\"Андрій\"><div class=\"cell-user\"><span class=\"avatar\" style=\"background:var(--clay-300)\">АМ<\/span><div><span class=\"strong\" style=\"font-size:14px\">Андрій Мельник<\/span><span class=\"sub\">Львів<\/span><\/div><\/div><\/td><td><span class=\"badge badge--dot badge--warning\">Відправлено<\/span><\/td><td class=\"num\" data-v=\"2320\"><span class=\"strong\">2 320 ₴<\/span><\/td><\/tr>\n<tr><td class=\"w-check\"><input type=\"checkbox\" class=\"check\" aria-label=\"10480\"><\/td><td><span class=\"strong\">№ 10480<\/span><\/td><td data-v=\"Ірина\"><div class=\"cell-user\"><span class=\"avatar\" style=\"background:var(--cocoa-300)\">ІБ<\/span><div><span class=\"strong\" style=\"font-size:14px\">Ірина Бойко<\/span><span class=\"sub\">Одеса<\/span><\/div><\/div><\/td><td><span class=\"badge badge--dot badge--success\">Доставлено<\/span><\/td><td class=\"num\" data-v=\"8900\"><span class=\"strong\">8 900 ₴<\/span><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"bulkbar glass-strong\" style=\"position:absolute;bottom:12px\"><span>Вибрано: <span data-count>0<\/span><\/span><button class=\"btn btn--ghost btn--sm\"><svg>…<\/svg>Друк<\/button><button class=\"btn btn--ghost btn--sm btn--icon\" data-clear-sel aria-label=\"Скасувати вибір\"><svg>…<\/svg><\/button><\/div><\/div>", "page": false, "summary": "Таблиця даних: пошук, сортування, вибір рядків із масовими діями. .table-card[data-table] > .table-toolbar + .table-scroll > table.table + .table-foot + .bulkbar."}, {"name": "Tabs", "group": "Content", "height": 200, "readme": "<p>Розділи контенту на одному місці з підкресленням, що ковзає (<code>color-primary<\/code>, <code>ease-emphasized<\/code>).<\/p>\n<ul>\n<li><code>[data-tabs]<\/code> &gt; <code>.tabs__list<\/code> &gt; <code>button.tabs__tab[aria-controls]<\/code> + <code>.tabs__panel#id<\/code> (неактивні — <code>hidden<\/code>).<\/li>\n<li>←→ Home End перемикають; ARIA tablist. Лічильник — <code>badge<\/code> у табі.<\/li>\n<li>2–3 рівноцінні варіанти вигляду → <code>SegmentedControl<\/code>.<\/li>\n<\/ul>", "code": "<div data-tabs><div class=\"tabs__list\"><button class=\"tabs__tab\" aria-selected=\"true\" aria-controls=\"p1\">Опис<\/button><button class=\"tabs__tab\" aria-controls=\"p2\">Характеристики<\/button><button class=\"tabs__tab\" aria-controls=\"p3\">Відгуки <span class=\"badge\">128<\/span><\/button><\/div>\n<div class=\"tabs__panel\" id=\"p1\"><p style=\"margin:0;max-width:60ch\">Крісло з масиву дуба, зібране без металу — лише шипові з'єднання.<\/p><\/div><div class=\"tabs__panel\" id=\"p2\" hidden><p style=\"margin:0\">Дуб, льон · 62 × 70 × 82 см · 9,4 кг<\/p><\/div><div class=\"tabs__panel\" id=\"p3\" hidden><p style=\"margin:0\" class=\"t-muted\">«Сидіти зручно навіть кілька годин.» — Андрій, Львів<\/p><\/div><\/div>", "page": false, "summary": "Розділи контенту на одному місці з підкресленням, що ковзає (color-primary, ease-emphasized)."}, {"name": "Tag", "group": "Status", "height": 120, "readme": "<p>Капсула-фільтр або вибране значення, яке можна прибрати.<\/p>\n<ul>\n<li>Фільтр: <code>button.tag[aria-pressed]<\/code>; вибраний — <code>.is-selected<\/code> (заливка <code>color-primary<\/code>). Hover — скляний.<\/li>\n<li>Знімний: <code>.tag<\/code> &gt; текст + <code>button.tag__x[aria-label=\"Прибрати\"]<\/code>.<\/li>\n<li>Висота 32px, <code>radius-full<\/code>, шрифт KyivType 500 14px.<\/li>\n<\/ul>", "code": "<div class=\"stack\"><div class=\"row\" id=\"chips\"><button class=\"tag is-selected\" aria-pressed=\"true\"><svg>…<\/svg>Усі<\/button><button class=\"tag\" aria-pressed=\"false\">Дуб<\/button><button class=\"tag\" aria-pressed=\"false\">Ясен<\/button><button class=\"tag\" aria-pressed=\"false\">Льон<\/button><button class=\"tag\" disabled>Disabled<\/button><\/div>\n<div class=\"row\" id=\"rm\"><span class=\"tag\">Київ<button class=\"tag__x\" aria-label=\"Прибрати\"><svg>…<\/svg><\/button><\/span><span class=\"tag\">До 2 000 ₴<button class=\"tag__x\" aria-label=\"Прибрати\"><svg>…<\/svg><\/button><\/span><\/div><\/div>", "page": false, "summary": "Капсула-фільтр або вибране значення, яке можна прибрати."}, {"name": "Toast", "group": "Status", "height": 300, "readme": "<p>Скляне сповіщення внизу праворуч (на телефоні — по центру). Викликається з коду: <code>DS.toast({type, title, text, action, duration})<\/code>.<\/p>\n<ul>\n<li>Типи <code>success | error | warning | info<\/code> з іконкою й кольором статусу; заголовок — що сталося, текст — деталь.<\/li>\n<li>5 секунд за замовчуванням, таймер зупиняється при наведенні чи фокусі; <code>duration: 0<\/code> — лише для помилок, що потребують дії.<\/li>\n<li>Дія: <code>action: {label: 'Скасувати', onClick}<\/code> — для зворотних операцій (видалення з кошика).<\/li>\n<li>Не більше 4 одночасно; <code>role=status<\/code> (помилка — <code>alert<\/code>), контейнер <code>aria-live=polite<\/code>.<\/li>\n<\/ul>", "code": "<div class=\"row\"><button class=\"btn btn--outline\" data-t=\"success\">Успіх<\/button><button class=\"btn btn--outline\" data-t=\"error\">Помилка<\/button><button class=\"btn btn--outline\" data-t=\"warning\">Попередження<\/button><button class=\"btn btn--outline\" data-t=\"info\">Інфо<\/button><button class=\"btn btn--outline\" data-t=\"undo\">З дією<\/button><\/div>", "page": false, "summary": "Скляне сповіщення внизу праворуч (на телефоні — по центру). Викликається з коду: DS.toast({type, title, text, action, duration})."}, {"name": "Tooltip", "group": "Status", "height": 140, "readme": "<p>Скляна підказка до іконки чи терміна: атрибут <code>data-tip=\"…\"<\/code> (+ <code>data-kbd=\"E\"<\/code> для клавіші) на будь-якому елементі.<\/p>\n<ul>\n<li>З'являється через 350 мс після наведення або одразу при фокусі; Esc ховає; біля верхнього краю — знизу.<\/li>\n<li>Лише доповнює: на телефоні hover немає, тож важливе не ховаємо в підказку. Кнопці-іконці все одно потрібен <code>aria-label<\/code>.<\/li>\n<\/ul>", "code": "<div class=\"row pill-group\" style=\"padding-top:40px\"><button class=\"btn btn--outline btn--icon\" aria-label=\"Редагувати\" data-tip=\"Редагувати\" data-kbd=\"E\"><svg>…<\/svg><\/button><button class=\"btn btn--outline btn--icon\" aria-label=\"Поділитися\" data-tip=\"Поділитися посиланням\"><svg>…<\/svg><\/button><span class=\"t-muted\" style=\"font:var(--text-body-s)\">Безкоштовна доставка <button class=\"btn btn--ghost btn--sm btn--icon\" aria-label=\"Умови\" data-tip=\"Для замовлень від 3 000 ₴\"><svg>…<\/svg><\/button><\/span><\/div>", "page": false, "summary": "Скляна підказка до іконки чи терміна: атрибут data-tip=\"…\" (+ data-kbd=\"E\" для клавіші) на будь-якому елементі."}], "mobile": "<p>Ліс проєктується mobile-first: спершу екран телефона 390×844 (перевіряємо 360 і 430), потім планшет і десктоп. Сторінка ніколи не скролиться вбік, а все, що на десктопі працює наведенням, на телефоні має зону натиску.<\/p>\n<h2>Брейкпоінти<\/h2>\n<table>\n<thead>\n<tr>\n<th>Режим<\/th>\n<th>Ширина<\/th>\n<th>Що змінюється<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Телефон<\/td>\n<td>до 640px<\/td>\n<td><code>TabBar<\/code> внизу, шторки замість поповерів, одна колонка, поля сторінки 16px<\/td>\n<\/tr>\n<tr>\n<td>Планшет<\/td>\n<td>641–1024px<\/td>\n<td><code>Navbar<\/code> зверху (до 860px посилання ховаються в меню), 2 колонки<\/td>\n<\/tr>\n<tr>\n<td>Десктоп<\/td>\n<td>від 1025px<\/td>\n<td>Повний <code>Navbar<\/code>, 12 колонок, контейнер до 1280px<\/td>\n<\/tr><\/tbody><\/table>\n<ul>\n<li>Медіазапити пишемо як <code>max-width<\/code> (спершу широке, потім звуження), значення беремо з таблиці. У <code>@media<\/code> змінні CSS не працюють, тому числа повторюються: 640, 860, 960, 1000.<\/li>\n<li>Елемент ніколи не задає десктопну ширину інлайном: <code>style=\"grid-template-columns:1fr 300px\"<\/code> перебиває медіазапит і стискає блок на телефоні. Для варіантів є модифікатори (<code>.checkout--sm<\/code>, <code>.product-grid--3<\/code>).<\/li>\n<\/ul>\n<h2>Зона натиску<\/h2>\n<ul>\n<li>Мінімум 44×44px (<code>--touch-target<\/code>). Кнопка <code>.btn--sm<\/code> (36px) на сенсорному екрані отримує невидиму зону 44px по вертикалі, тег і сегмент — теж.<\/li>\n<li>Між сусідніми цілями — щонайменше 8px (<code>space-2<\/code>). Дві дрібні іконки поруч — це промах.<\/li>\n<li>Головна дія екрана — у нижній третині, там, де лежить великий палець: <code>TabBar<\/code>, шторка, липка кнопка. Деструктивні дії — далі від великого пальця й з підтвердженням.<\/li>\n<\/ul>\n<h2>Safe area<\/h2>\n<ul>\n<li>Фіксовані елементи (нижня навігація, липка кнопка, шторка) відступають на <code>--safe-bottom<\/code>, шапки — на <code>--safe-top<\/code>. У <code>&lt;head&gt;<\/code> — <code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"&gt;<\/code>, інакше <code>env()<\/code> повертає 0.<\/li>\n<li>Сторінці з <code>TabBar<\/code> додайте <code>.has-tabbar<\/code> на <code>body<\/code> (з <code>.tabbar--mobile<\/code> прямо в <code>body<\/code> відступ додається сам, лише до 640px). Тости й шторки піднімаються над капсулою самі.<\/li>\n<\/ul>\n<h2>Навігація<\/h2>\n<ul>\n<li>На телефоні розділи верхнього рівня — у <code>TabBar<\/code>: 3–5 пунктів, іконка й підпис, активний <code>aria-current=\"page\"<\/code>. Зверху лишається компактна шапка: назва екрана, пошук, кошик.<\/li>\n<li><code>Navbar<\/code> — для планшета й десктопа. Не показуйте обидва одразу: <code>TabBar<\/code> має <code>.tabbar--mobile<\/code>, <code>Navbar<\/code> ховає посилання до 860px.<\/li>\n<li>Рідкісні розділи — в п'ятому пункті «Ще», що відкриває шторку зі списком.<\/li>\n<li>Головна дія екрана (оформлення, збереження) — у липкій капсулі <code>.action-bar<\/code> над <code>TabBar<\/code>: сума й одна primary-кнопка. Сторінці з нею додайте <code>.has-actionbar<\/code>.<\/li>\n<\/ul>\n<h2>Шторки<\/h2>\n<ul>\n<li>До 640px <code>Modal<\/code> виїжджає знизу, а <code>Select<\/code> і <code>DatePicker<\/code> відкриваються шторкою: великі рядки (48px), календар з клітинками 44px, затемнення позаду, закриття кліком по ньому або Esc.<\/li>\n<li>Шторка завжди має спосіб закритися без точного прицілювання: кнопка «Закрити» чи затемнення. Висота — не більше 70% екрана.<\/li>\n<li>Список із пошуком не викликає клавіатуру сам: поле фокусується після натиску на нього.<\/li>\n<\/ul>\n<h2>Форми<\/h2>\n<ul>\n<li>Одна колонка, мітка над полем, висота поля 44px, шрифт 16px (менший шрифт змушує iOS наближати сторінку).<\/li>\n<li>Фільтри — один рядок із горизонтальним скролом (<code>.filters--scroll<\/code>), товари — дві колонки компактних карток (<code>.product-grid--compact<\/code>).<\/li>\n<li>Правильна клавіатура: <code>inputmode=\"numeric\"<\/code> для цифр, <code>type=\"tel\"<\/code>, <code>type=\"email\"<\/code>, <code>autocomplete=\"given-name\"<\/code> тощо. Дати вибираємо календарем, а не друкуємо.<\/li>\n<li>Помилка — під полем, словами, не лише кольором. Кнопку відправки не ховаємо під клавіатурою: липка кнопка внизу форми.<\/li>\n<\/ul>\n<h2>Типографіка на телефоні<\/h2>\n<ul>\n<li>Заголовки адаптивні (<code>clamp<\/code>): <code>h1<\/code> 34px, <code>h2<\/code> 28px на 390px. Ermilov широкий: довге слово у <code>h1<\/code> переноситься, тому шукайте коротші формулювання, а не зменшуйте шрифт нижче 18px.<\/li>\n<li>Текст 16px, підписи не менші за 12px. Рядок не довший за екран: без горизонтального скролу, таблиці — у власному контейнері з <code>overflow-x: auto<\/code>.<\/li>\n<\/ul>\n<h2>Перед випуском<\/h2>\n<ul>\n<li>Немає горизонтального скролу на 360, 390, 430px. Усе керується одним пальцем.<\/li>\n<li>Жоден інтерактивний елемент не менший за 44px і не ховається під <code>TabBar<\/code>, клавіатурою чи вирізом.<\/li>\n<li>Обидві теми, поворот екрана, збільшений шрифт системи (до 130%) і «зменшити рух» перевірені.<\/li>\n<\/ul>"};

const TABOF=h=>h.startsWith('c-')||h==='components'?'components':['colors','type','foundations','mobile'].includes(h)?'tokens':h==='demo'?'demo':h==='overview'?'overview':null;
function tabs(h){const t=TABOF(h);document.querySelectorAll('#appTabs [data-tab]').forEach(a=>{a.toggleAttribute('aria-current',a.dataset.tab===t);a.dataset.tab===t?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')})}
function closeSheet(){document.body.classList.remove('nav-open');const m=$('#tabMore');if(m){m.setAttribute('aria-expanded','false');m.classList.remove('is-active')}}
function coverCompact(){return matchMedia('(max-width:640px)').matches}
function fitCover(){const w=$('#cw');if(w){const f=w.querySelector('iframe'),c=coverCompact();if(w.classList.contains('is-compact')!==c){w.classList.toggle('is-compact',c);f.src=f.src.replace(/compact=\d/,'compact='+(c?1:0))}f.style.transform=`scale(${w.clientWidth/(c?480:960)})`}}
addEventListener('resize',fitCover);addEventListener('hashchange',render);
addEventListener('message',e=>{if(e.data&&e.data.dsHeight){document.querySelectorAll('iframe.frame').forEach(f=>{if(f.contentWindow===e.source)f.style.height=Math.max(e.data.dsHeight,80)+'px'})}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(!c)return;const v=c.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>DS.toast({type:'success',title:'Скопійовано',text:v,duration:1800})).catch(()=>DS.toast({type:'info',title:v}))});
$('#tabMore').onclick=()=>{const o=document.body.classList.toggle('nav-open');$('#tabMore').setAttribute('aria-expanded',o);$('#tabMore').classList.toggle('is-active',o)};$('#scrim').onclick=closeSheet;$('#sheetClose').onclick=()=>{closeSheet();$('#tabMore').focus()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav-open')){closeSheet();$('#tabMore').focus()}});
nav();render();DS.init(document.querySelector('.top'));
const seg=$('#themeSeg');seg._c.set(theme);seg.addEventListener('seg:change',e=>{theme=e.detail.value;document.documentElement.dataset.theme=theme;try{localStorage.setItem('lis-theme',theme)}catch(_){}
 document.querySelectorAll('iframe').forEach(f=>{try{f.contentWindow.postMessage({dsTheme:theme},'*')}catch(_){}});if(['colors','foundations'].includes((location.hash||'').slice(1)))render()});
</script>
