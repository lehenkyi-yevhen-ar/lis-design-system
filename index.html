<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ліс — дизайн-система</title>
<meta name="author" content="Євген Легенький">
<meta name="description" content="Земляна дизайн-система: дві теми, Ermilov + KyivType Sans, скляні шари, компоненти й шаблони.">
<link rel="stylesheet" href="tokens.css?v=20261106a">
<link rel="stylesheet" href="components/bundle.css?v=20261106a">
<style>
:root{--side:272px}
body{min-height:100vh}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--color-border);padding:20px 14px 40px;background:var(--color-bg)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 18px}
.brand a{font:700 26px/1 var(--font-display);text-transform:uppercase;color:var(--color-text);text-decoration:none}
.nav-g{font:var(--text-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-text-muted);padding:18px 10px 6px}
.nav a{display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:0 10px;border-radius:var(--radius-md);color:var(--color-text);text-decoration:none;font:500 14px/1.2 var(--font-body)}
.nav a:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--color-primary) 18%,transparent);color:var(--color-text);font-weight:600}
.nav a:focus-visible{outline:var(--focus-ring-width) solid var(--color-focus);outline-offset:-2px}
.main{min-width:0;padding:32px clamp(16px,4vw,56px) 96px}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.crumb{font:var(--text-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-secondary)}
h1.pg{font:var(--text-h1);text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.lead{font:var(--text-body-l);color:var(--color-text-muted);max-width:var(--measure);margin:0}
.md{max-width:760px}.md h2{font:var(--text-h3);margin:40px 0 12px}.md h3{font:var(--text-h4);margin:28px 0 10px}
.md p,.md li{color:var(--color-text-muted)}.md li{margin:6px 0}.md strong{color:var(--color-text)}
.md code,.code-inline{overflow-wrap:anywhere;font:13px/1.4 var(--font-mono);color:var(--color-accent-text);background:color-mix(in srgb,var(--color-text) 6%,transparent);padding:1px 5px;border-radius:4px}
.frame{width:100%;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-bg);display:block;margin:24px 0 0}
.cover{width:100%;aspect-ratio:960/300;border:0;border-radius:var(--radius-xl);overflow:hidden;display:block;margin-bottom:32px}
.cover-wrap{position:relative;width:100%;aspect-ratio:960/300;border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--color-border);margin-bottom:32px}
.cover-wrap iframe{position:absolute;left:0;top:0;width:960px;height:300px;border:0;transform-origin:0 0}
.cover-wrap.is-compact{aspect-ratio:480/300}.cover-wrap.is-compact iframe{width:480px}
details.src{margin-top:16px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface)}
details.src summary{cursor:pointer;padding:12px 16px;font:var(--text-label);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.src summary::-webkit-details-marker{display:none}
details.src pre{margin:0;padding:16px;overflow:auto;max-height:420px;border-top:1px solid var(--color-border);font:12px/1.55 var(--font-mono);color:var(--color-text-muted);white-space:pre-wrap;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);text-decoration:none;color:inherit;transition:border-color var(--duration-fast),transform var(--duration-base) var(--ease-standard)}
.ccard:hover{border-color:var(--color-border-strong);transform:translateY(-2px)}
.ccard b{font:var(--text-h4)}.ccard span{font:var(--text-body-s);color:var(--color-text-muted)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sw{display:grid;grid-template-columns:56px 56px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}
.sw i{display:block;height:44px;margin-bottom:18px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);position:relative}
.sw i small{position:absolute;bottom:-17px;left:0;font:11px/1 var(--font-mono);color:var(--color-text-muted)}
.sw div{min-width:0}.sw b{display:block;font:600 13px/1.3 var(--font-mono)}.sw span{font:var(--text-caption);color:var(--color-text-muted)}
.ramp{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));border-radius:var(--radius-md);overflow:hidden;margin:8px 0 22px}
.ramp button{border:0;padding:26px 6px 8px;text-align:left;font:500 11px/1.25 var(--font-mono);cursor:pointer}
.ramp button b{display:block;font:700 13px/1 var(--font-body)}
@media(max-width:700px){.ramp{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:420px){.ramp{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tbl{width:100%;border-collapse:collapse;font:var(--text-body-s)}.tbl td,.tbl th{padding:10px 8px;border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle}
.tbl th{font:600 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
.tbl code{font:12px/1.4 var(--font-mono);color:var(--color-accent-text)}
.scroll{overflow-x:auto}
.ts{padding:22px 0;border-bottom:1px solid var(--color-border);display:grid;grid-template-columns:150px minmax(0,1fr) 220px;gap:16px;align-items:center}
.ts .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){.ts{grid-template-columns:minmax(0,1fr)}.ts .s{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}}
.spec{font:12px/1.5 var(--font-mono);color:var(--color-text-muted)}
h2.sec{font:var(--text-h2);text-transform:uppercase;margin:48px 0 14px}
.top__brand{display:none;font:700 26px/1 var(--font-display);text-transform:uppercase;color:var(--color-text);text-decoration:none}
.sheet-grab{display:none}.brand__r{display:flex;align-items:center;gap:6px}.sheet-close{display:none}
#appTabs{display:none}
.subnav{display:none}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 /* меню розділів на телефоні — шторка знизу, відкривається вкладкою «Ще» */
 .side{position:fixed;inset:auto 0 0 0;height:auto;max-height:82dvh;z-index:var(--z-modal);border:0;border-radius:var(--radius-xl) var(--radius-xl) 0 0;background:var(--surface-3);transform:translateY(104%);visibility:hidden;transition:transform var(--duration-slow) var(--ease-emphasized),visibility 0s linear var(--duration-slow);box-shadow:var(--elevation-4);padding:8px 14px calc(28px + var(--safe-bottom));overscroll-behavior:contain}
 body.nav-open .side{transform:none;visibility:visible;transition-delay:0s}
 .sheet-close{display:inline-flex}
 .sheet-grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--color-border-strong);margin:4px auto 6px}
 .nav a{min-height:48px;font-size:16px}
 .top__brand{display:inline-block}
 .main{padding-top:calc(16px + var(--safe-top));padding-bottom:calc(var(--tabbar-height) + 56px + var(--safe-bottom))}
 #appTabs{display:flex}
 .subnav{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 20px;padding:0 16px;scrollbar-width:none}
 .subnav::-webkit-scrollbar{display:none}
 .subnav .tag{flex:none;height:40px;padding:0 16px;font-size:15px;text-decoration:none}
 .top{margin-bottom:20px}
}
.md table{display:block;overflow-x:auto;border-collapse:collapse;font:var(--text-body-s);margin:16px 0}
.md th,.md td{padding:10px 12px;border-bottom:1px solid var(--color-border);text-align:left;vertical-align:top}
.md th{font:600 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);white-space:nowrap}
.md td:first-child{color:var(--color-text);font-weight:600;white-space:nowrap}
.phones{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin:28px 0 8px}
.phone-frame{position:relative;width:min(100%,402px);padding:6px;border-radius:52px;background:var(--surface-3);box-shadow:0 0 0 1px var(--color-border-strong),var(--elevation-3)}
.phone-frame iframe{display:block;width:100%;height:780px;border:0;border-radius:46px;background:var(--color-bg)}
.phones-alt{display:none}
@media(max-width:640px){.phones{display:none}.phones-alt{display:block;margin:24px 0}}
.phone-cap{text-align:center;font:var(--text-caption);color:var(--color-text-muted);margin-top:10px}

.scrim{display:none}body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(18,22,17,.5);z-index:calc(var(--z-modal) - 1)}
.dl-list a{color:var(--color-accent-text)}
.author{margin:28px 6px 0;padding:14px;border:1px solid var(--color-border);border-radius:var(--radius-lg);font:var(--text-body-s)}
.author b{display:block;font:600 14px/1.3 var(--font-body);margin:4px 0 8px}
.author a{display:inline-flex;align-items:center;gap:6px;color:var(--color-accent-text);text-decoration:none;margin-right:12px}.author a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side" aria-label="Розділи"><div class="sheet-grab" aria-hidden="true"></div><div class="brand"><a href="#overview">Ліс</a><span class="brand__r"><span class="badge">v1</span><button type="button" class="btn btn--ghost btn--icon sheet-close" id="sheetClose" aria-label="Закрити меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></span></div><nav class="nav" id="nav"></nav><div class="author"><span class="t-eyebrow t-muted">Автор системи</span><b>Євген Легенький</b><a href="https://www.instagram.com/legen_eugnekyi/" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/in/yevhen-lehenkyi/" target="_blank" rel="noopener">LinkedIn</a></div></aside>
<div class="scrim" id="scrim"></div>
<nav class="tabbar glass" id="appTabs" aria-label="Навігація сайтом">

<a class="tabbar__item" href="#colors" data-tab="tokens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16c1.1 0 1.6-.8 1.6-1.6 0-.5-.3-.9-.5-1.3-.4-.7 0-1.6.9-1.6H16a4 4 0 0 0 4-4C20 7.1 16.4 4 12 4Z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="11" r="1"/></svg><span>Токени</span></a>
<a class="tabbar__item" href="#components" data-tab="components"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Каталог</span></a>
<a class="tabbar__item" href="#demo" data-tab="demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg><span>Демо</span></a>
<button class="tabbar__item" type="button" id="tabMore" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Ще</span></button>
</nav>

<main class="main" id="main"><div class="wrap">
<div class="top"><a class="top__brand" href="#overview">Ліс</a><span></span>
<div class="segmented glass" role="group" aria-label="Тема" id="themeSeg"><button class="segmented__btn" data-value="dark" aria-pressed="true">Темна</button><button class="segmented__btn" data-value="light" aria-pressed="false">Світла</button></div></div>

<script>
const D={"tokens": {"name": "Ліс", "version": 1, "color": {"themes": [{"id": "dark", "name": "Темна"}, {"id": "light", "name": "Світла"}], "tokens": [{"name": "color-bg", "value": {"dark": "{sand-950}", "light": "{sand-50}"}, "usage": "Фон сторінки. Темна: зелено-чорний; світла: теплий беж."}, {"name": "color-surface", "value": {"dark": "{sand-900}", "light": "{sand-100}"}, "usage": "Картки, панелі, поля таблиць на фоні bg."}, {"name": "color-surface-raised", "value": {"dark": "{sand-800}", "light": "#FFFCF7"}, "usage": "Підняті поверхні: тултіпи, вкладені блоки, hover у списках."}, {"name": "color-border", "value": {"dark": "{sand-700}", "light": "{sand-200}"}, "usage": "Тонкі роздільники та рамки карток (декоративні, без вимоги контрасту)."}, {"name": "color-border-strong", "value": {"dark": "{sand-500}", "light": "{sand-500}"}, "usage": "Рамки полів, чекбоксів, контурних кнопок: ≥3:1 до bg в обох темах."}, {"name": "color-text", "value": {"dark": "{sand-100}", "light": "{sand-950}"}, "usage": "Основний текст на bg, surface, surface-raised (≥10:1)."}, {"name": "color-text-muted", "value": {"dark": "{sand-400}", "light": "{sand-600}"}, "usage": "Підписи, метадані, допоміжний текст на bg і surface (≥4.9:1)."}, {"name": "color-primary", "value": {"dark": "{forest-300}", "light": "{forest-700}"}, "usage": "Головна дія (кнопка primary), активні стани, обране. Як текст — на bg (≥6.6:1)."}, {"name": "color-primary-hover", "value": {"dark": "{forest-200}", "light": "{forest-800}"}, "usage": "Hover основної кнопки."}, {"name": "color-on-primary", "value": {"dark": "{sand-950}", "light": "{sand-50}"}, "usage": "Текст та іконки на заливці primary."}, {"name": "color-secondary", "value": {"dark": "{cocoa-300}", "light": "{cocoa-700}"}, "usage": "Вторинна дія того ж рівня; цитати, великі цифри. Як текст — на bg (≥7:1)."}, {"name": "color-secondary-hover", "value": {"dark": "{cocoa-200}", "light": "{cocoa-800}"}, "usage": "Hover вторинної кнопки."}, {"name": "color-on-secondary
