<!doctype html>
<html lang="uk">
<head><link rel="stylesheet" href="../../tokens.css?v=20261103b"><link rel="stylesheet" href="../bundle.css?v=20261103b">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=t||'dark';
addEventListener('message',function(e){if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme});
function h(){parent.postMessage({dsHeight:document.documentElement.scrollHeight,name:location.pathname},'*')}
addEventListener('load',function(){h();new ResizeObserver(h).observe(document.body)})})()</script>
<script src="../bundle.js?v=20261103b"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toast — preview</title>
<style>body{padding:clamp(12px,3.5vw,20px);background:var(--color-bg)} .pv-label{font:var(--text-caption);color:var(--color-text-muted);margin:0 0 8px}</style></head>
<body>

<div class="row"><button class="btn btn--outline" data-t="success">Успіх</button><button class="btn btn--outline" data-t="error">Помилка</button><button class="btn btn--outline" data-t="warning">Попередження</button><button class="btn btn--outline" data-t="info">Інфо</button><button class="btn btn--outline" data-t="undo">З дією</button></div>
<script>DS.init();const T={success:{type:'success',title:'Збережено',text:'Зміни в замовленні збережено.'},error:{type:'error',title:'Не вдалося оплатити',text:'Банк відхилив платіж. Спробуйте іншу картку.'},warning:{type:'warning',title:'Залишилось 2 шт.',text:'Товар закінчується.'},info:{type:'info',title:'Нова версія',text:'Оновіть сторінку.'},undo:{type:'success',title:'Видалено з кошика',text:'Крісло «Дуб»',action:{label:'Скасувати'}}};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>DS.toast(T[b.dataset.t]));DS.toast({type:'success',title:'Додано в кошик',text:'Крісло «Дуб», 1 шт.',duration:0});</script>
</body>
</html>
