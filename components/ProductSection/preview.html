<!doctype html>
<html lang="uk">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=t||'dark';
addEventListener('message',function(e){if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme});
function h(){parent.postMessage({dsHeight:document.documentElement.scrollHeight,name:location.pathname},'*')}
addEventListener('load',function(){h();new ResizeObserver(h).observe(document.body)})})()</script>
<script src="../bundle.js"></script><meta charset="utf-8"><title>ProductSection — preview</title>
<style>body{padding:20px;background:var(--color-bg)} .pv-label{font:var(--text-caption);color:var(--color-text-muted);margin:0 0 8px}</style></head>
<body>
<style>.art{position:absolute;inset:0;background:var(--g)}.art::before,.art::after{content:"";position:absolute;border-radius:50%}
.a1{--g:linear-gradient(150deg,var(--forest-600),var(--forest-900))}.a1::before{width:46%;height:40%;left:27%;top:24%;background:var(--cocoa-300);border-radius:24% 24% 8px 8px}.a1::after{width:54%;height:9%;left:23%;top:62%;background:var(--cocoa-500);border-radius:6px}
.a2{--g:linear-gradient(160deg,var(--clay-300),var(--clay-600))}.a2::before{width:40%;height:50%;left:30%;top:18%;background:var(--sand-100);border-radius:50% 50% 12px 12px}.a2::after{width:8%;height:28%;left:46%;top:56%;background:var(--cocoa-700);border-radius:4px}
.a3{--g:linear-gradient(150deg,var(--sand-300),var(--sand-500))}.a3::before{width:60%;height:30%;left:20%;top:35%;background:var(--forest-700);border-radius:999px}.a3::after{width:22%;height:18%;left:39%;top:41%;background:var(--amber-300)}
.a5{--g:linear-gradient(170deg,var(--forest-300) 0%,var(--forest-700) 55%,var(--forest-900))}.a5::before{width:70%;height:90%;left:-12%;bottom:-40%;background:var(--forest-800)}.a5::after{width:80%;height:80%;right:-28%;bottom:-36%;background:var(--forest-600)}
.stagebg{position:absolute;inset:0;background:linear-gradient(160deg,var(--forest-800),var(--sand-950) 55%,var(--cocoa-900));overflow:hidden}
[data-theme="light"] .stagebg{background:linear-gradient(160deg,var(--forest-200),var(--sand-100) 50%,var(--clay-100))}
.blob{position:absolute;border-radius:50%;filter:blur(10px)}.b1{width:260px;height:260px;background:var(--clay-400);left:50%;top:-60px;opacity:.85}.b2{width:220px;height:220px;background:var(--forest-300);left:-40px;bottom:-80px;opacity:.8}.b3{width:160px;height:160px;background:var(--amber-300);right:6%;bottom:8%;opacity:.7}
</style>
<div class="section__head" style="margin-bottom:24px"><div><span class="section__eyebrow">Каталог</span><h2 class="section__title">Популярне зараз</h2></div><a class="btn btn--outline" href="#">Усі товари <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
<div class="filters"><button class="tag is-selected" aria-pressed="true">Усі</button><button class="tag" aria-pressed="false">Крісла</button><button class="tag" aria-pressed="false">Світло</button></div>
<div class="product-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
<a class="card card--interactive" href="#" onclick="event.preventDefault()"><div class="card__media"><div class="art a1"></div></div><div class="card__body"><h3 class="card__title">Крісло «Дуб»</h3><div class="card__foot"><span class="price">12 400 ₴</span><button class="btn btn--primary btn--sm btn--icon" aria-label="В кошик"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button></div></div></a>
<a class="card card--interactive" href="#" onclick="event.preventDefault()"><div class="card__media"><div class="art a2"></div></div><div class="card__body"><h3 class="card__title">Лампа «Глина»</h3><div class="card__foot"><span class="price">2 320 ₴</span><button class="btn btn--primary btn--sm btn--icon" aria-label="В кошик"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button></div></div></a>
<a class="card card--interactive" href="#" onclick="event.preventDefault()"><div class="card__media"><div class="art a3"></div></div><div class="card__body"><h3 class="card__title">Кошик плетений</h3><div class="card__foot"><span class="price">1 850 ₴</span><button class="btn btn--primary btn--sm btn--icon" aria-label="В кошик"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button></div></div></a></div>
<script>DS.init();</script>
</body>
</html>
