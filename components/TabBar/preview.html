<!-- @dsCard group="Navigation" height=520 subtitle="Нижня навігація для телефона" -->
<!doctype html>
<html lang="uk">
<head><link rel="stylesheet" href="../../tokens.css?v=20261103c"><link rel="stylesheet" href="../bundle.css?v=20261103c">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=t||'dark';
addEventListener('message',function(e){if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme});
function h(){parent.postMessage({dsHeight:document.documentElement.scrollHeight,name:location.pathname},'*')}
addEventListener('load',function(){h();new ResizeObserver(h).observe(document.body)})})()</script>
<script src="../bundle.js?v=20261103c"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TabBar — preview</title>
<style>body{padding:clamp(12px,3.5vw,20px);background:var(--color-bg)} .pv-label{font:var(--text-caption);color:var(--color-text-muted);margin:0 0 8px}
.stage{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center}
/* макет екрана телефона: tabbar тут absolute, у справжній сторінці він fixed */
.phone{position:relative;width:min(100%,360px);height:440px;border-radius:36px;overflow:hidden;border:1px solid var(--color-border-strong);background:var(--color-bg)}
.phone .tabbar{position:absolute;left:12px;right:12px;bottom:12px}
.phone__bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;font:var(--text-label)}
.phone__body{position:absolute;inset:44px 0 0;padding:16px 16px 96px;overflow:hidden;display:grid;gap:12px;align-content:start}
.sk{height:96px;border-radius:var(--radius-lg);background:var(--color-surface-raised)} .sk.h{height:140px;background:linear-gradient(150deg,var(--forest-600),var(--forest-900))}
.sk.s{height:14px;width:60%;border-radius:7px}
</style></head>
<body>
<p class="pv-label">Темна й світла — перемикач теми зверху. Клік по пункту змінює aria-current.</p>
<div class="stage">
 <div class="phone"><div class="phone__bar">Ліс</div>
  <div class="phone__body"><div class="sk h"></div><div class="sk s"></div><div class="sk"></div><div class="sk"></div></div>
  <nav class="tabbar glass" aria-label="Основна навігація" id="tb1">
   <a class="tabbar__item" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg><span>Головна</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Каталог</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Кошик</span><span class="tabbar__badge" aria-label="2 товари">2</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Профіль</span></a>
  </nav></div>
 <div class="phone"><div class="phone__bar">Ліс</div>
  <div class="phone__body"><div class="sk"></div><div class="sk"></div><div class="sk s"></div><div class="sk"></div></div>
  <nav class="tabbar glass" aria-label="П'ять розділів" id="tb2">
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg><span>Головна</span></a>
   <a class="tabbar__item" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Каталог</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span>Обране</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Кошик</span><span class="tabbar__badge" aria-label="12 товарів">12</span></a>
   <a class="tabbar__item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Ще</span></a>
  </nav></div>
</div>
<script>DS.init();
document.querySelectorAll('.tabbar').forEach(function(nav){nav.addEventListener('click',function(e){var a=e.target.closest('.tabbar__item');if(!a)return;e.preventDefault();nav.querySelectorAll('.tabbar__item').forEach(function(x){x.removeAttribute('aria-current')});a.setAttribute('aria-current','page')})});</script>
</body>
</html>
