<!doctype html>
<html lang="uk"><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=t||'dark';
addEventListener('message',function(e){if(e.data&&e.data.dsTheme)document.documentElement.dataset.theme=e.data.dsTheme});
function h(){parent.postMessage({dsHeight:document.documentElement.scrollHeight,name:location.pathname},'*')}
addEventListener('load',function(){h();new ResizeObserver(h).observe(document.body)})})()</script>
<script src="../bundle.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cover</title>
<style>
html,body{margin:0;height:100%}body{background:var(--color-bg);position:relative;overflow:hidden;width:960px;height:300px}
svg{position:absolute;left:480px;top:0;width:480px;height:300px}
.forest{fill:var(--color-primary)}.cocoa{fill:var(--color-secondary)}.clay{fill:var(--color-accent)}.ink{fill:var(--forest-800)}.sand{fill:var(--sand-200)}
.name{position:absolute;left:40px;bottom:72px;max-width:440px;margin:0;font:700 120px/.92 var(--font-display);text-transform:uppercase;color:var(--color-text);letter-spacing:-.01em}
.cover-tag{position:absolute;left:44px;bottom:40px;max-width:440px;margin:0;font:400 14px/1.4 var(--font-body);color:var(--color-text-muted)}
</style></head><body>
<!--
blocks: color-primary 208×300 (tall slab, bleeds top & bottom), color-secondary 160×176, color-accent 160×112, forest-800 112×112, sand-200 disc ⌀96 (radius-full)
arrangement: one tall forest slab with satellites, stacked right; blocks touch on space-0 seams like timber joinery
pattern: arcs (literal motif — the brand's rounded radii and leaf/canopy shapes): quarter-circles cut from blocks at radius-xl multiples
scales: sides from space-24 (96) / space-32 (128) multiples; corners radius-xl (24) on cocoa, radius-full disc
-->
<svg viewBox="0 0 480 300" aria-hidden="true">
<rect class="forest" x="0" y="0" width="208" height="300"/>
<circle class="ink" cx="0" cy="300" r="128"/>
<rect class="cocoa" x="208" y="0" width="160" height="176" rx="24"/>
<path class="ink" d="M368 0 h112 v112 a112 112 0 0 1 -112 -112 Z"/>
<rect class="clay" x="208" y="188" width="160" height="112"/>
<path class="forest" d="M368 300 v-112 a112 112 0 0 1 112 112 Z"/>
<circle class="sand" cx="424" cy="160" r="40"/>
<circle class="cocoa" cx="104" cy="96" r="48"/>
</svg>
<h1 class="name">Ліс</h1>
<p class="cover-tag">Земляна дизайн-система: беж, ліс, кава й теракота. Ermilov + KyivType Sans.</p>
</body></html>
